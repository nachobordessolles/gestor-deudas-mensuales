<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Deudas y Gastos</title>
  <style>
    :root {
      --bg: #1a1a1a; --bg2: #222; --bg3: #333; --bg4: #1a1a1a;
      --border: #333; --border2: #444;
      --text: #fff; --text2: #aaa; --text3: #999; --text4: #666;
      --pos: #6f8; --neg: #f88; --warn: #fa0;
      --green-bg: #2a5a3a; --green-border: #3a7a4a; --green-bg2: #1a3a2a;
      --red-bg: #5a2a2a; --red-border: #7a4a4a; --red-bg2: #3a1a2a;
      --tab-active-bg: #2a5a3a; --tab-active-border: #4a7a5a;
      --metric-bg: #1a1a1a;
      --th-bg: #1a1a1a; --total-bg: #1a1a1a;
      --edit-row: #2a3a4a;
      --grand-total-bg: #1a1a1a;
    }
    html.light {
      --bg: #f0f2f5; --bg2: #fff; --bg3: #e8eaed; --bg4: #f5f5f5;
      --border: #ddd; --border2: #ccc;
      --text: #111; --text2: #555; --text3: #777; --text4: #aaa;
      --pos: #1a7a3a; --neg: #c0392b; --warn: #d68910;
      --green-bg: #d4edda; --green-border: #28a745; --green-bg2: #e8f5e9;
      --red-bg: #f8d7da; --red-border: #dc3545; --red-bg2: #fdecea;
      --tab-active-bg: #28a745; --tab-active-border: #1a7a3a;
      --metric-bg: #f5f5f5;
      --th-bg: #f0f2f5; --total-bg: #f0f2f5;
      --edit-row: #e3f0fb;
      --grand-total-bg: #f0f2f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 1rem; transition: background 0.2s, color 0.2s; }
    .container { max-width: 900px; margin: 0 auto; }
    .tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
    .tab { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border2); background: var(--bg2); color: var(--text2); cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .tab.active { background: var(--tab-active-bg); color: var(--text); border-color: var(--tab-active-border); }
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
    .card-title { font-size: 15px; font-weight: 500; }
    .card-title.saldado { text-decoration: line-through; color: var(--text4); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 1rem; }
    th { text-align: left; padding: 8px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); background: var(--th-bg); }
    td { padding: 8px; border-bottom: 1px solid var(--border); }
    tr.paid td { color: var(--text4); text-decoration: line-through; }
    tr.total-row td { font-weight: 500; background: var(--total-bg); border-top: 1px solid var(--border2); }
    .badge { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 500; }
    .badge-saldado { background: var(--green-bg); color: var(--pos); }
    .badge-pos { background: var(--green-bg2); color: var(--pos); }
    .badge-neg { background: var(--red-bg2); color: var(--neg); }
    .metric { background: var(--metric-bg); border-radius: 6px; padding: 12px; text-align: center; }
    .metric-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
    .metric-value { font-size: 18px; font-weight: 500; }
    .metric-value.neg { color: var(--neg); }
    .metric-value.pos { color: var(--pos); }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .month-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; justify-content: center; }
    .month-nav button { background: var(--bg3); border: 1px solid var(--border2); color: var(--text); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .month-label { font-size: 14px; font-weight: 500; min-width: 120px; text-align: center; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; color: var(--text3); }
    input, select { background: var(--bg3); border: 1px solid var(--border2); color: var(--text); padding: 6px; border-radius: 4px; font-size: 12px; }
    button { background: var(--green-bg); border: 1px solid var(--green-border); color: #fff; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
    button:hover { background: var(--green-border); }
    button.danger { background: var(--red-bg); border-color: var(--red-border); color: var(--neg); }
    button.danger:hover { background: var(--red-border); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--pos); }
    .inline-input { width: 50px; padding: 3px 4px; text-align: center; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); }
    .edit-row td { background: var(--edit-row); }
    .grand-total { background: var(--grand-total-bg); border-radius: 6px; padding: 14px; margin-top: 1rem; border: 1px solid var(--border); }
    .section-divider { font-size: 11px; font-weight: 500; color: var(--text3); padding: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.02em; }
    .cat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .save-badge { font-size: 11px; padding: 4px 8px; border-radius: 4px; display: none; white-space: nowrap; }
    .save-ok { background: var(--green-bg); color: var(--pos); }
    .save-err { background: var(--red-bg); color: var(--neg); }
    .hide { display: none !important; }
    .chip { display: inline-block; font-size: 10px; padding: 1px 6px; background: var(--bg3); color: var(--text3); border-radius: 3px; margin-left: 4px; }
    .chip.last { background: var(--green-bg); color: var(--pos); }
    /* Modo toggle */
    .mode-btn { background: none; border: 1px solid var(--border2); color: var(--text2); padding: 5px 10px; font-size: 13px; }
    .mode-btn:hover { background: var(--bg3); }
    /* Comparativa */
    .comp-badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
    .comp-up { background: var(--red-bg2); color: var(--neg); }
    .comp-down { background: var(--green-bg2); color: var(--pos); }
  </style>
</head>
<body>
<div class="container">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 8px;">
    <h1 style="font-size: 20px;">Gestor de Deudas</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="mode-btn" id="mode-toggle" onclick="toggleModo()" title="Cambiar modo">🌙</button>
      <span id="save-badge" class="save-badge"></span>
    </div>
  </div>
  
  <div class="tabs" id="tabs">
    <button class="tab active" onclick="setView('resumen')">📅 Mes</button>
    <button class="tab" onclick="setView('detalle')">👥 Personas</button>
    <button class="tab" onclick="setView('lista')">📋 Cuotas</button>
    <button class="tab" onclick="setView('fijos')">🏠 Fijos</button>

  </div>

  <div id="view-resumen"></div>
  <div id="view-detalle" class="hide"></div>
  <div id="view-lista" class="hide"></div>
  <div id="view-fijos" class="hide"></div>
  <div id="view-categorias" class="hide"></div>
  <div id="view-agregar" class="hide"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

<script>
// ── Auth ─────────────────────────────────────────────────────────────
const PASS_ADMIN = 'Poseidon321.@';
const PASS_GUEST = 'Invitado';
let modoLectura = false;
let modoClaro = localStorage.getItem('modo-claro')==='1';
function toggleModo(){
  modoClaro=!modoClaro;
  localStorage.setItem('modo-claro', modoClaro?'1':'0');
  aplicarModo();
}
function aplicarModo(){
  document.documentElement.classList.toggle('light', modoClaro);
  const btn=document.getElementById('mode-toggle');
  if(btn) btn.textContent=modoClaro?'🌙':'☀️';
}
aplicarModo();

function mostrarLogin(){
  document.body.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a1a;">
      <div style="background:#222;border:1px solid #333;border-radius:10px;padding:2rem;width:320px;text-align:center;">
        <div style="font-size:32px;margin-bottom:0.5rem;">🔐</div>
        <h2 style="font-size:18px;font-weight:500;margin-bottom:0.25rem;color:#fff;">Gestor de Deudas</h2>
        <p style="font-size:12px;color:#666;margin-bottom:1.5rem;">Ingresá tu clave para continuar</p>
        <input id="login-pass" type="password" placeholder="Contraseña" autofocus
          style="width:100%;background:#333;border:1px solid #444;color:#fff;padding:10px;border-radius:6px;font-size:14px;margin-bottom:10px;box-sizing:border-box;"
          onkeydown="if(event.key==='Enter')doLogin()">
        <button onclick="doLogin()"
          style="width:100%;background:#2a5a3a;border:1px solid #3a7a4a;color:#fff;padding:10px;border-radius:6px;font-size:14px;cursor:pointer;">
          Entrar
        </button>
        <p id="login-err" style="color:#f88;font-size:12px;margin-top:10px;display:none;">Clave incorrecta</p>
      </div>
    </div>`;
  setTimeout(()=>document.getElementById('login-pass').focus(),100);
}

function doLogin(){
  const val = document.getElementById('login-pass').value;
  if(val === PASS_ADMIN){
    modoLectura = false;
    iniciarApp();
  } else if(val === PASS_GUEST){
    modoLectura = true;
    iniciarApp();
  } else {
    document.getElementById('login-err').style.display='block';
    document.getElementById('login-pass').value='';
    document.getElementById('login-pass').focus();
  }
}

function iniciarApp(){
  document.body.innerHTML = `
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:8px;">
      <h1 style="font-size:20px;">Gestor de Deudas${modoLectura?' <span style="font-size:11px;background:#333;color:#aaa;padding:3px 8px;border-radius:4px;">Solo lectura</span>':''}</h1>
      <span id="save-badge" class="save-badge"></span>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" id="tab-resumen" onclick="setView(\'resumen\')">📅 Mes</button>
      <button class="tab" id="tab-detalle" onclick="setView(\'detalle\')">👥 Personas</button>
      <button class="tab" id="tab-lista" onclick="setView(\'lista\')">📋 Cuotas</button>
      <button class="tab" id="tab-fijos" onclick="setView(\'fijos\')">🏠 Fijos <span id="badge-fijos" style="display:none;background:#f88;color:#111;border-radius:10px;font-size:10px;padding:1px 5px;margin-left:2px;"></span></button>
      <button class="tab" id="tab-stats" onclick="setView(\'stats\')">📊 Estadísticas</button>
      <button class="tab" id="tab-tarjetas" onclick="setView(\'tarjetas\')">💳 Tarjetas</button>
      <button class="tab" id="tab-categorias" onclick="setView(\'categorias\')">🏷 Categorías</button>
      ${modoLectura?'':'<button class="tab" id="tab-agregar" onclick="setView(\'agregar\')">➕ Agregar</button>'}
    </div>
    <div id="view-resumen"></div>
    <div id="view-detalle" class="hide"></div>
    <div id="view-lista" class="hide"></div>
    <div id="view-fijos" class="hide"></div>
    <div id="view-stats" class="hide"></div>
    <div id="view-tarjetas" class="hide"></div>
    <div id="view-categorias" class="hide"></div>
    ${modoLectura?'':'<div id="view-agregar" class="hide"></div>'}
  </div>`;
  init();
}
// ────────────────────────────────────────────────────────────────────

const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const FREQ_LABEL={mensual:'Mensual',bimestral:'Bimestral',trimestral:'Trimestral',semestral:'Semestral',anual:'Anual',semanal:'Semanal'};
const FREQ_MONTHS={mensual:1,bimestral:2,trimestral:3,semestral:6,anual:12};
const CAT_COLORS=['#378ADD','#1D9E75','#D85A30','#7F77DD','#D4537E','#BA7517','#639922','#E24B4A','#888780'];

const TODAY=new Date();
const CURRENT_MONTH=TODAY.getMonth();
const CURRENT_YEAR=TODAY.getFullYear();

let currentView='resumen', currentMonthIdx=CURRENT_MONTH;
let deudas=[],fijos=[],pagados={},categorias=[],saldados={};
let editingId=null,editingFijoId=null,saveTimer=null;
let filtroLista='', ordenLista='persona', ordenDir=1;
let tarjetasPorMes={};
let mesTarjetaSeleccionado=null;
let tipoTarjetaSeleccionado='visa-galicia-mas'; // persiste el tipo elegido

const DEFAULT_DEUDAS=[];
const DEFAULT_CATS=[{id:201,nombre:'Servicios',color:'#378ADD'}];
const DEFAULT_FIJOS=[];

// ── Google Sheets sync ──────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyapuNqn2pZnSJV8SbcBTEp2ypHTx-_RHKoHS-yQZ3zqBXovPq-XsOKhEt64I1hFmWzaQ/exec';
const CSV_URL    = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRsQ46aaLcLYVdXY20SWXzxAAeH6rbh8KfTWajrFwi6_LLK-OJUsEW4Cj0ytLqhFPUmUiE3d252CHoy/pub?gid=1971480074&single=true&output=csv&t=';

// Fallback a localStorage para no perder datos si falla la red
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));return true;}catch(e){return false;}}
function load(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}}

async function guardarSheets(){
  const estado = {
    deudas, fijos, pagados, categorias, saldados, tarjetasPorMes,
    ts: Date.now()
  };
  // Guardar en localStorage como backup inmediato
  save('gd-deudas',deudas);save('gd-fijos',fijos);save('gd-pagados',pagados);
  save('gd-cats',categorias);save('gd-saldados',saldados);save('gd-tarjetas',tarjetasPorMes);
  try {
    await fetch(SCRIPT_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ accion:'guardar', estado: JSON.stringify(estado) })
    });
    showBadge(true);
  } catch(e) {
    showBadge(false);
  }
}

async function cargarSheets(){
  try {
    const r = await fetch(CSV_URL + Date.now());
    const txt = await r.text();
    // Buscar la línea que empieza con "estado,"
    // El JSON está en la segunda columna, envuelto en comillas dobles con comillas internas escapadas como ""
    const match = txt.match(/^estado,(.+)$/m);
    if(!match) return null;
    let raw = match[1].trim();
    // Si está rodeado de comillas dobles, quitarlas y des-escapar ""  ->  "
    if(raw.startsWith('"') && raw.endsWith('"')){
      raw = raw.slice(1,-1).replace(/""/g,'"');
    }
    return JSON.parse(raw);
  } catch(e) {
    console.error('Error cargando Sheets:', e);
    return null;
  }
}
// ────────────────────────────────────────────────────────────────────

function migrateDeudas(arr){return arr.map(d=>({...d, anoInicio: d.anoInicio || 2026}));}
function migrateFijos(arr){return arr.map(f=>({...f, anoBase: f.anoBase || 2026}));}
function fmt(n){return '$'+Math.round(Math.abs(n)).toLocaleString('es-AR');}

function getCuotaEnMes(d,m,a){
  const mesActual = a*12 + m;
  const mesDeuda  = (d.anoInicio||2026)*12 + d.mesInicio;
  const o = mesActual - mesDeuda;
  if(o<0) return null;
  const c = d.cuotaInicio + o;
  return c > d.cuotaTotal ? null : c;
}
function getPersonas(){return[...new Set(deudas.map(d=>d.persona))];}
function getMonto(d){return d.negativo?-d.monto:d.monto;}
function fijoActivoEnMes(f,m,a){
  // Si está desactivado, solo mostrar en meses anteriores al de desactivación
  if(f.activo===false){
    const mesDesact=(f.anoDesactivacion||CURRENT_YEAR)*12+(f.mesDesactivacion||CURRENT_MONTH);
    const mesConsulta=a*12+m;
    return mesConsulta<mesDesact; // aparece en historial (meses previos al de desactivación)
  }
  if(f.frecuencia==='semanal') return true;
  const mesActual=(a)*12+m;const mesBase=((f.anoBase||2026))*12+f.mesBase;const o=mesActual-mesBase;return o>=0&&o%FREQ_MONTHS[f.frecuencia]===0;
}
// Devuelve array de fechas (Date) de cada ocurrencia semanal en el mes m/a
// diaSemana: 0=dom,1=lun,...,6=sab  (f.diaSemana)
function getSemanasDelMes(f,m,a){
  const dia=f.diaSemana||1; // default lunes
  const fechas=[];
  const d=new Date(a,m,1);
  // avanzar hasta el primer día de la semana pedido
  while(d.getDay()!==dia) d.setDate(d.getDate()+1);
  while(d.getMonth()===m){
    fechas.push(new Date(d));
    d.setDate(d.getDate()+7);
  }
  return fechas;
}
function semanaKey(id,m,a,idx){return`sw-${id}-${m}-${a}-${idx}`;}
function isSemPagada(id,m,a,idx){return!!(pagados[semanaKey(id,m,a,idx)]);}
function toggleSemana(id,m,a,idx){const k=semanaKey(id,m,a,idx);if(pagados[k])delete pagados[k];else pagados[k]=true;guardar();renderFijos();renderResumen();}
// Override de monto por semana individual
function semOverrideKey(id,m,a,idx){return`so-${id}-${m}-${a}-${idx}`;}
function montoSemanaEfectivo(f,m,a,idx){
  const k=semOverrideKey(f.id,m,a,idx);
  if(f.montoOverrides&&f.montoOverrides[k]!==undefined) return f.montoOverrides[k];
  return f.monto;
}
function editarMontoSemana(id,m,a,idx){
  if(modoLectura)return;
  const f=fijos.find(x=>x.id===id);if(!f)return;
  const actual=montoSemanaEfectivo(f,m,a,idx);
  const input=prompt(
    `Monto de "${f.nombre}" — Semana ${idx+1} de ${MONTHS[m]} ${a}:\n(Base: $${Math.round(f.monto).toLocaleString('es-AR')} | Ingresá 0 si no aplica)`,
    actual
  );
  if(input===null)return;
  const nuevo=parseFloat(input.replace(',','.'));
  if(isNaN(nuevo)||nuevo<0){alert('Monto inválido');return;}
  if(!f.montoOverrides)f.montoOverrides={};
  const k=semOverrideKey(id,m,a,idx);
  if(nuevo===f.monto){
    delete f.montoOverrides[k];
  } else {
    f.montoOverrides[k]=nuevo;
  }
  guardar();renderFijos();renderResumen();
}

function pagoKey(id,m,a){return`${id}-${m}-${a}`;}
function isPagado(id,m,a){return!!(pagados[pagoKey(id,m,a)]);}
function togglePago(id,m,a){const k=pagoKey(id,m,a);if(pagados[k])delete pagados[k];else pagados[k]=true;guardar();renderFijos();renderResumen();}
function toggleFijoActivo(id,mesDesde,anoDesde){
  const f=fijos.find(x=>x.id===id);
  if(!f)return;
  if(f.activo===false){
    // Reactivar: limpiar mes de desactivación
    f.activo=true;
    delete f.mesDesactivacion;
    delete f.anoDesactivacion;
  } else {
    // Desactivar desde el mes que se está viendo
    f.activo=false;
    f.mesDesactivacion=mesDesde!=null?mesDesde:currentMonthIdx;
    f.anoDesactivacion=anoDesde!=null?anoDesde:CURRENT_YEAR;
  }
  guardar();renderFijos();
}
function getCatById(id){return categorias.find(c=>c.id===id)||{nombre:'General',color:'#888780'};}

// Devuelve el monto efectivo de un fijo en un mes dado (respeta override si existe)
function montoFijoEfectivo(f,m,a){
  const key=`${a}-${String(m+1).padStart(2,'0')}`;
  if(f.montoOverrides&&f.montoOverrides[key]!==undefined) return f.montoOverrides[key];
  return f.monto;
}

function editarMontoFijoMes(id){
  if(modoLectura)return;
  const f=fijos.find(x=>x.id===id);if(!f)return;
  const m=currentMonthIdx,a=CURRENT_YEAR;
  const key=`${a}-${String(m+1).padStart(2,'0')}`;
  const actual=montoFijoEfectivo(f,m,a);
  const input=prompt(
    `Monto de "${f.nombre}" para ${MONTHS[m]} ${a}:\n(Base: $${Math.round(f.monto).toLocaleString('es-AR')} | Ingresá 0 si no aplica este mes)`,
    actual
  );
  if(input===null)return;
  const nuevo=parseFloat(input.replace(',','.'));
  if(isNaN(nuevo)||nuevo<0){alert('Monto inválido');return;}
  if(!f.montoOverrides)f.montoOverrides={};
  if(nuevo===f.monto){
    delete f.montoOverrides[key]; // si ponés el mismo que base, limpia el override
  } else {
    f.montoOverrides[key]=nuevo;
  }
  guardar();renderFijos();renderResumen();
}

function getTotalFijoMes(f,m,a){
  if(!fijoActivoEnMes(f,m,a)) return 0;
  if(f.frecuencia==='semanal') return getSemanasDelMes(f,m,a).reduce((s,_,i)=>s+montoSemanaEfectivo(f,m,a,i),0);
  return montoFijoEfectivo(f,m,a);
}
function getTotalDeudaMes(m,a){return deudas.reduce((s,d)=>{const c=getCuotaEnMes(d,m,a);return c!==null?s+getMonto(d):s;},0);}
function getTotalFijosMes(m,a){return fijos.reduce((s,f)=>s+getTotalFijoMes(f,m,a),0);}
function getTotalFijosPend(m,a){
  return fijos.reduce((s,f)=>{
    if(!fijoActivoEnMes(f,m,a)) return s;
    if(f.frecuencia==='semanal'){
      const sems=getSemanasDelMes(f,m,a);
      return s+sems.reduce((t,_,i)=>isSemPagada(f.id,m,a,i)?t:t+montoSemanaEfectivo(f,m,a,i),0);
    }
    return !isPagado(f.id,m,a)?s+montoFijoEfectivo(f,m,a):s;
  },0);
}
function catSelectOptions(sid){return categorias.map(c=>`<option value="${c.id}"${c.id===sid?' selected':''}>${c.nombre}</option>`).join('');}
function saldoKey(p,m,a){return`${p}-${m}-${a}`;}
function isSaldado(p,m,a){return!!saldados[saldoKey(p,m,a)];}
function toggleSaldado(p,m,a){const k=saldoKey(p,m,a);if(saldados[k])delete saldados[k];else saldados[k]=true;guardar();renderResumen();}

function showBadge(ok, msg){
  const b=document.getElementById('save-badge');if(!b)return;
  b.textContent=msg||(ok?'☁ Guardado en Sheets':'⚠ Guardado local');
  b.className='save-badge '+(ok?'save-ok':'save-err');
  b.style.display='inline';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{b.style.display='none';},3000);
}
function guardar(){
  if(modoLectura) return;
  guardarSheets();
}

function renderResumen(){
  const M=currentMonthIdx,A=CURRENT_YEAR;
  const personas=getPersonas();
  const td=getTotalDeudaMes(M,A),tf=getTotalFijosMes(M,A),fp=getTotalFijosPend(M,A);

  // td positivo = me deben (ingreso, resta del total a pagar)
  // td negativo = yo debo (egreso, suma al total)
  const tdEgreso=Math.max(0,-td);   // cuotas que YO pago
  const tdIngreso=Math.max(0,td);   // cuotas que ME pagan

  // Calcular total tarjetas del mes
  const mesKeyT=A+'-'+String(M+1).padStart(2,'0');
  const tarjMesObj=tarjetasPorMes[mesKeyT]||{};
  const tt=Object.values(tarjMesObj).reduce((s,t)=>{
    const cuotas=(t.seccionesTarjeta||[]).reduce((a,sec)=>a+(sec.cuotas||[]).reduce((b,c)=>b+c.monto,0),0);
    const unPago=(t.unPago||[]).reduce((a,c)=>a+c.monto,0);
    const bonifs=(t.bonificaciones||[]).reduce((a,c)=>a+c.monto,0);
    return s+cuotas+unPago-bonifs;
  },0);
  const tg=tdEgreso+tf+tt-tdIngreso;
  const fijosAct=fijos.filter(f=>f.frecuencia!=='semanal'&&fijoActivoEnMes(f,M,A));

  // Alertas vencimiento
  const alertas=getAlertas();
  let alertHtml='';
  if(alertas.length>0){
    alertHtml=`<div style="background:#3a2a1a;border:1px solid #7a5a1a;border-radius:8px;padding:10px 14px;margin-bottom:1rem;">
      <div style="font-size:12px;font-weight:500;color:#fa0;margin-bottom:6px;">🔔 Vencimientos próximos</div>`;
    alertas.forEach(a=>{
      const color=a.diff===0?'#f88':a.diff===1?'#fa0':'#ff6';
      const label=a.diff===0?'HOY':a.diff===1?'mañana':`en ${a.diff} días`;
      alertHtml+=`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;">
        <span style="color:#fff">${a.nombre}</span>
        <span style="color:${color};font-weight:500">${label}</span>
      </div>`;
    });
    alertHtml+=`</div>`;
  }

  // ── Comparativa mes anterior ──────────────────────────────────────
  const Mprev=M===0?11:M-1, Aprev=M===0?A-1:A;
  const tdPrev=getTotalDeudaMes(Mprev,Aprev), tfPrev=getTotalFijosMes(Mprev,Aprev);
  const mesKeyPrev=Aprev+'-'+String(Mprev+1).padStart(2,'0');
  const ttPrev=Object.values(tarjetasPorMes[mesKeyPrev]||{}).reduce((s,t)=>{
    const c=(t.seccionesTarjeta||[]).reduce((a,sec)=>a+(sec.cuotas||[]).reduce((b,cc)=>b+cc.monto,0),0);
    const u=(t.unPago||[]).reduce((a,cc)=>a+cc.monto,0);
    const b=(t.bonificaciones||[]).reduce((a,cc)=>a+cc.monto,0);
    return s+c+u-b;
  },0);
  const tdPrevEgreso=Math.max(0,-tdPrev);
  const tgPrev=tdPrevEgreso+tfPrev+ttPrev;
  const diffAbs=Math.abs(tg-tgPrev);
  const diffPct=tgPrev>0?Math.round((tg-tgPrev)/tgPrev*100):0;
  const compHtml=tgPrev>0?`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
    <span style="font-size:12px;color:var(--text3)">vs ${MONTHS[Mprev]}: <strong style="color:var(--text)">${fmt(tgPrev)}</strong></span>
    <span class="comp-badge ${tg>tgPrev?'comp-up':'comp-down'}">${tg>tgPrev?'▲':'▼'} ${fmt(diffAbs)} (${Math.abs(diffPct)}%)</span>
  </div>`:'';

  // ── Proyección próximo mes ─────────────────────────────────────────
  const Mnext=M===11?0:M+1, Anext=M===11?A+1:A;
  const tdNext=getTotalDeudaMes(Mnext,Anext);
  const tfNext=getTotalFijosMes(Mnext,Anext);
  const tdNextEgreso=Math.max(0,-tdNext);   // cuotas que YO pago el próximo mes
  const tdNextIngreso=Math.max(0,tdNext);   // cuotas que ME pagan el próximo mes

  // Cuotas de tarjetas activas el próximo mes
  let ttNextVencen=0;   // cuotas cuya última cuota es el próximo mes
  let ttNextSiguen=0;   // cuotas que continúan más allá del próximo mes
  Object.values(tarjetasPorMes[mesKeyT]||{}).forEach(t=>{
    (t.seccionesTarjeta||[]).forEach(sec=>{
      (sec.cuotas||[]).forEach(c=>{
        if(c.cuotaActual<c.cuotaTotal){
          const esUltimaEnSiguiente=(c.cuotaActual+1===c.cuotaTotal);
          if(esUltimaEnSiguiente) ttNextVencen+=c.monto;
          else ttNextSiguen+=c.monto;
        }
      });
    });
  });
  const ttNext=ttNextVencen+ttNextSiguen;

  const tgNext=tdNextEgreso+tfNext+ttNext-tdNextIngreso;

  // Columnas dinámicas según qué hay
  const cols=[];
  if(tdNextIngreso>0) cols.push(`<div style="font-size:11px;color:var(--text3)">Ingresos personas
    <div style="font-size:13px;font-weight:500;color:var(--pos)">${fmt(tdNextIngreso)}</div>

    <div style="font-size:13px;font-weight:500;color:var(--neg)">${fmt(tdNextEgreso)}</div>

  cols.push(`<div style="font-size:11px;color:var(--text3)">Fijos

    <div style="font-size:13px;font-weight:500;color:var(--neg)">${fmt(ttNext)}</div>
    ${ttNextVencen>0?`<div style="font-size:10px;color:var(--pos);margin-top:2px">↓ ${fmt(ttNextVencen)} última cuota</div>`:''}
  </div>`);

  const proyHtml=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:1rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:12px;color:var(--text3)">📈 Proyección ${MONTHS[Mnext]} ${Anext}</span>
      <span style="font-size:16px;font-weight:600;color:var(--neg)">${fmt(tgNext)}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(${cols.length},1fr);gap:6px;border-top:1px solid var(--border);padding-top:8px">
      ${cols.join('')}
    </div>
  </div>`;

  let html=alertHtml+compHtml+proyHtml+`<div style="text-align:right;margin-bottom:8px;">
    <button onclick="exportarMes()" style="background:var(--bg3);border-color:var(--border2);color:var(--text2);font-size:11px;padding:5px 10px;">📤 Exportar mes</button>

    <button onclick="changeMonth(-1)">←</button>
    <span class="month-label">${MONTHS[M]} ${A}</span>
    <button onclick="changeMonth(1)">→</button>
  </div>
  <div class="summary-grid">
    <div class="metric"><div class="metric-label">Total neto</div><div class="metric-value ${tg<0?'pos':'neg'}">${fmt(Math.abs(tg))}</div></div>
    ${tdIngreso>0?`<div class="metric"><div class="metric-label">Ingresos</div><div class="metric-value pos">${fmt(tdIngreso)}</div></div>`:''}
    ${tdEgreso>0?`<div class="metric"><div class="metric-label">Cuotas a pagar</div><div class="metric-value neg">${fmt(tdEgreso)}</div></div>`:''}
    <div class="metric"><div class="metric-label">Fijos</div><div class="metric-value neg">${fmt(tf)}</div></div>
    <div class="metric"><div class="metric-label">Pendientes</div><div class="metric-value neg">${fmt(fp)}</div></div>
    ${tt>0?`<div class="metric"><div class="metric-label">Tarjetas</div><div class="metric-value neg">${fmt(tt)}</div></div>`:''}
  </div>`;
  if(personas.length){
    html+=`<div class="section-divider">Cuotas por persona</div>`;
    personas.forEach(p=>{
      const items=deudas.filter(d=>d.persona===p&&getCuotaEnMes(d,M,A)!==null);
      if(!items.length)return;
      const tot=items.reduce((s,d)=>s+getMonto(d),0);
      const sald=isSaldado(p,M,A);
      html+=`<div class="card"><div class="card-header">
        <div style="flex:1">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" ${sald?'checked':''} onchange="toggleSaldado('${p}',${M},${A})">
            <span class="card-title ${sald?'saldado':''}">${p}</span>
            ${sald?'<span class="badge badge-saldado">Saldado</span>':''}
          </label>
        </div>
        <span class="badge ${tot<0?'badge-neg':'badge-pos'}">${tot<0?'-':''}${fmt(tot)}</span>
      </div>
      <table><thead><tr><th>Producto</th><th style="width:40%;text-align:right">Cuota</th><th style="text-align:right">Monto</th></tr></thead><tbody>`;
      items.forEach(d=>{
        const c=getCuotaEnMes(d,M,A);
        const isLast=c===d.cuotaTotal,isSub=d.cuotaTotal===999;
        html+=`<tr class="${sald?'paid':''}"><td>${d.producto}${isLast?'<span class="chip last">última</span>':''}${isSub?'<span class="chip">sub</span>':''}</td>
          <td style="text-align:right">${isSub?'—':c+'/'+d.cuotaTotal}</td>
          <td style="text-align:right;color:${d.negativo?'#f88':'#fff'}">${d.negativo?'-':''}${fmt(d.monto)}</td></tr>`;
      });
      html+=`<tr class="total-row"><td colspan="2" style="text-align:right">Total</td><td style="text-align:right;color:${tot<0?'#f88':'#fff'}">${tot<0?'-':''}${fmt(tot)}</td></tr></tbody></table>
      <div style="text-align:right;margin-top:8px;">
        <button onclick="copiarPersona('${p}',${M},${A})" style="background:#333;border-color:#444;color:#aaa;font-size:11px;padding:5px 10px;">
          📋 Copiar
        </button>
      </div>
      </div>`;
    });
  }
  if(fijosAct.length){
    html+=`<div class="section-divider">Gastos fijos este mes</div><div class="card">
    <table><thead><tr><th style="width:8%"></th><th>Gasto</th><th style="width:20%;text-align:right">Día</th><th style="width:25%;text-align:right">Monto</th></tr></thead><tbody>`;
    fijosAct.forEach(f=>{
      const paid=isPagado(f.id,M,A),cat=getCatById(f.categoriaId);
      const mesKey=`${A}-${String(M+1).padStart(2,'0')}`;
      const tieneOverride=f.montoOverrides&&f.montoOverrides[mesKey]!==undefined;
      const montoEfectivo=montoFijoEfectivo(f,M,A);
      html+=`<tr class="${paid?'paid':''}">
        <td style="text-align:center"><input type="checkbox" ${paid?'checked':''} onchange="togglePago(${f.id},${M},${A})"></td>
        <td><span class="cat-dot" style="background:${cat.color}"></span>${f.nombre}${tieneOverride?`<span style="font-size:10px;color:var(--warn);margin-left:4px" title="Monto ajustado para este mes">✎</span>`:''}</td>
        <td style="text-align:right;font-size:11px">${f.vencimiento}</td>
        <td style="text-align:right;color:${paid?'#666':'#f88'}">
          ${paid?'<s>':''}${fmt(montoEfectivo)}${paid?'</s>':''}
          ${modoLectura?'':` <button onclick="editarMontoFijoMes(${f.id})" title="Ajustar monto para este mes" style="background:none;border:none;cursor:pointer;color:#666;font-size:11px;padding:0 2px;line-height:1">✎</button>`}
        </td>
      </tr>`;
    });
    html+=`<tr class="total-row"><td colspan="2"></td><td style="text-align:right">Pend:</td><td style="text-align:right;color:#f88">-${fmt(fp)}</td></tr></tbody></table></div>`;
  }
  
  // Fijos semanales
  const fijosSem=fijos.filter(f=>f.frecuencia==='semanal');
  if(fijosSem.length){
    html+=`<div class="section-divider">Gastos semanales este mes</div><div class="card">
    <table><thead><tr><th style="width:8%"></th><th>Gasto</th><th style="width:20%;text-align:right">Semana</th><th style="width:25%;text-align:right">Monto</th></tr></thead><tbody>`;
    const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    fijosSem.forEach(f=>{
      const cat=getCatById(f.categoriaId);
      const sems=getSemanasDelMes(f,M,A);
      const pag=sems.filter((_,i)=>isSemPagada(f.id,M,A,i)).length;
      const total=sems.length*f.monto;
      html+=`<tr>
        <td style="text-align:center">-</td>
        <td><span class="cat-dot" style="background:${cat.color}"></span>${f.nombre}</td>
        <td style="text-align:right;font-size:11px">${pag}/${sems.length} pagadas</td>
        <td style="text-align:right;color:#f88">${fmt(total)}</td>
      </tr>`;
      sems.forEach((fecha,i)=>{
        const paid=isSemPagada(f.id,M,A,i);
        const fechaStr=fecha.getDate()+'/'+(fecha.getMonth()+1);
        const mEfectivo=montoSemanaEfectivo(f,M,A,i);
        const tieneOv=f.montoOverrides&&f.montoOverrides[semOverrideKey(f.id,M,A,i)]!==undefined;
        html+=`<tr class="${paid?'paid':''}" style="background:#1a1a1a">
          <td style="text-align:center"><input type="checkbox" ${paid?'checked':''} onchange="toggleSemana(${f.id},${M},${A},${i})"></td>
          <td style="padding-left:20px;font-size:11px">Semana ${i+1}${tieneOv?` <span style="color:var(--warn);font-size:10px" title="Monto ajustado">✎</span>`:''}</td>
          <td style="text-align:right;font-size:11px;color:#999">${DIAS[fecha.getDay()]} ${fechaStr}</td>
          <td style="text-align:right;font-size:12px;color:${paid?'#666':'#f88'}">
            ${paid?'<s>':''}${fmt(mEfectivo)}${paid?'</s>':''}
            ${modoLectura?'':` <button onclick="editarMontoSemana(${f.id},${M},${A},${i})" title="Ajustar monto semana ${i+1}" style="background:none;border:none;cursor:pointer;color:#666;font-size:11px;padding:0 2px;line-height:1">✎</button>`}
          </td>
        </tr>`;
      });
    });
  html+=`</tbody></table></div>`;
  }

  // ── Sección Tarjetas ──────────────────────────────────────────────
  const mesKey=A+'-'+String(M+1).padStart(2,'0');
  const tarjMes=tarjetasPorMes[mesKey]?Object.entries(tarjetasPorMes[mesKey]):[];
  
  const TIPO_LABEL={'visa-galicia-mas':'Visa Galicia Más','visa-galicia':'Visa Galicia','master-galicia':'Master Galicia','visa-patagonia':'Visa Patagonia'};
  let totalTarjetas=0;

  if(tarjMes.length>0){
    html+=`<div class="section-divider">Tarjetas de crédito</div><div class="card">
    <table><thead><tr><th style="width:8%"></th><th>Tarjeta</th><th style="text-align:right;width:30%">Total a pagar</th></tr></thead><tbody>`;
    tarjMes.forEach(([key,t])=>{
      const todasCuotas=t.seccionesTarjeta?t.seccionesTarjeta.reduce((a,s)=>a.concat(s.cuotas||[]),[]):(t.cuotas||[]);
      const totalCuotas=todasCuotas.reduce((s,c)=>s+c.monto,0);
      const totalUnPago=(t.unPago||[]).reduce((s,c)=>s+c.monto,0);
      const totalBonifs=(t.bonificaciones||[]).reduce((s,c)=>s+c.monto,0);
      const totalT=totalCuotas+totalUnPago-totalBonifs;
      totalTarjetas+=totalT;
      const paid=isPagado('tarjeta-'+key,M,A);
      html+=`<tr class="${paid?'paid':''}">
        <td style="text-align:center"><input type="checkbox" ${paid?'checked':''} onchange="togglePago('tarjeta-${key}',${M},${A})"></td>
        <td style="font-size:13px">${TIPO_LABEL[t.tipo]||t.nombre}</td>
        <td style="text-align:right;color:${paid?'#666':'#f88'}">${paid?'<s>':''}${fmt(totalT)}${paid?'</s>':''}</td>
      </tr>`;
    });
    html+=`<tr class="total-row"><td colspan="2" style="text-align:right">Total tarjetas:</td>
      <td style="text-align:right;color:#f88">${fmt(totalTarjetas)}</td>
    </tr></tbody></table></div>`;
  }

  const tg2=tdEgreso+tf+tt-tdIngreso;
  html+=`<div class="grand-total">
    <strong>${MONTHS[M]} ${A}</strong><br>
    ${tdIngreso>0?'Ingresos: '+fmt(tdIngreso)+' | ':''}${tdEgreso>0?'Cuotas: '+fmt(tdEgreso)+' | ':''}Fijos: ${fmt(tf)}${tt>0?' | Tarjetas: '+fmt(tt):''}
    <br><strong>Total neto: ${fmt(Math.abs(tg2))}</strong>
  </div>`;
  document.getElementById('view-resumen').innerHTML=html;
  actualizarBadgeFijos();
}

function renderDetalle(){
  const M=currentMonthIdx,A=CURRENT_YEAR;
  const personas=getPersonas();
  let html='';
  personas.forEach(p=>{
    const items=deudas.filter(d=>d.persona===p);
    if(!items.length)return;
    const totalResta=items.reduce((s,d)=>{if(d.cuotaTotal===999)return s;return s+(d.cuotaTotal-d.cuotaInicio+1)*(d.negativo?-d.monto:d.monto);},0);

    html+=`<div class="card"><div class="card-header">
      <div style="flex:1">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" ${sald?'checked':''} onchange="toggleSaldado('${p}',${M},${A})">
          <span class="card-title ${sald?'saldado':''}">${p}</span>
          ${sald?'<span class="badge badge-saldado">Saldado</span>':''}
        </label>
      </div>
      <span class="badge ${totalResta<0?'badge-neg':'badge-pos'}">Resta: ${totalResta<0?'-':''}${fmt(totalResta)}</span>
    </div>
    <table><thead><tr><th>Producto</th><th style="text-align:right">Cuotas</th><th style="text-align:right">Por cuota</th><th style="text-align:right">Total</th></tr></thead><tbody>`;
    items.forEach(d=>{
      const isSub=d.cuotaTotal===999,r=isSub?'∞':(d.cuotaTotal-d.cuotaInicio+1),tr=isSub?'∞':fmt(r*d.monto);
      html+=`<tr class="${sald?'paid':''}"><td>${d.producto}</td><td style="text-align:right">${isSub?'Sub':d.cuotaInicio+'/'+d.cuotaTotal}</td><td style="text-align:right;color:${d.negativo?'#f88':'#fff'}">${d.negativo?'-':''}${fmt(d.monto)}</td><td style="text-align:right;color:${d.negativo?'#f88':'#fff'}">${d.negativo?'-':''}${tr}</td></tr>`;
    });
    html+=`</tbody></table></div>`;
  });
  document.getElementById('view-detalle').innerHTML=html;
}

  const neto=totPos-totNeg;

  // Filtrar y ordenar
  let lista=deudas.filter(d=>{
    if(!filtroLista)return true;
    const t=filtroLista.toLowerCase();
    return d.persona.toLowerCase().includes(t)||d.producto.toLowerCase().includes(t);
  });

    let va,vb;
    if(ordenLista==='persona'){va=a.persona.toLowerCase();vb=b.persona.toLowerCase();}
    else if(ordenLista==='producto'){va=a.producto.toLowerCase();vb=b.producto.toLowerCase();}
    else if(ordenLista==='monto'){va=a.monto;vb=b.monto;}
    else if(ordenLista==='ano'){va=a.anoInicio||2026;vb=b.anoInicio||2026;}
    if(va<vb)return -1*ordenDir;

function filtrarLista(val){filtroLista=val;
  // re-render sin perder foco del input
  const lista=deudas.filter(d=>{if(!filtroLista)return true;const t=filtroLista.toLowerCase();return d.persona.toLowerCase().includes(t)||d.producto.toLowerCase().includes(t);});
  renderLista();
  const inp=document.getElementById('busqueda');if(inp){inp.focus();inp.setSelectionRange(val.length,val.length);}
}
function ordenar(col){if(ordenLista===col)ordenDir*=-1;else{ordenLista=col;ordenDir=1;}renderLista();}

function startEdit(id){if(modoLectura)return;editingId=(editingId===id)?null:id;renderLista();}
function cancelEdit(){editingId=null;renderLista();}
function guardarEdit(id){
  const d=deudas.find(x=>x.id===id);if(!d)return;
  const persona=document.getElementById('e-persona').value.trim();
  const producto=document.getElementById('e-producto').value.trim();
  const monto=parseFloat(document.getElementById('e-monto').value);
  const cini=parseInt(document.getElementById('e-cini').value);
  const ctotVal=document.getElementById('e-ctot').value.trim();
  const ctot=ctotVal===''?999:parseInt(ctotVal);
  const mesInicio=parseInt(document.getElementById('e-mes').value);
  const anoInicio=parseInt(document.getElementById('e-ano').value)||2026;
  const negativo=document.getElementById('e-neg').value==='true';
  const notas=document.getElementById('e-notas').value.trim();
  if(!persona||!producto||isNaN(monto)||isNaN(cini)||isNaN(ctot)){alert('Completá todos los campos');return;}
  Object.assign(d,{persona,producto,monto,cuotaInicio:cini,cuotaTotal:ctot,mesInicio,anoInicio,negativo,notas});
  editingId=null;
  guardar();
  renderLista();
}

function descargarBackup(){
  const estado={deudas,fijos,pagados,categorias,saldados,ts:Date.now()};
  const blob=new Blob([JSON.stringify(estado,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const fecha=new Date().toISOString().split('T')[0];
  a.download=`backup-deudas-${fecha}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function restaurarBackup(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const estado=JSON.parse(e.target.result);
      if(!estado.deudas){alert('Archivo inválido');return;}
      if(!confirm('¿Reemplazar todos los datos actuales con los del backup?'))return;
      aplicarEstado(estado);
      guardar();
      renderResumen();
      alert('✓ Backup restaurado correctamente');
      setView('resumen');
    }catch(err){alert('Error leyendo el archivo: '+err.message);}
  };
  reader.readAsText(file);
}

// ── Notificaciones ──
function actualizarEstadoNotif(){
  const el=document.getElementById('notif-estado');const btn=document.getElementById('btn-notif');
  if(!el)return;
  if(!('Notification'in window)){el.textContent='Tu navegador no soporta notificaciones.';if(btn)btn.disabled=true;return;}
  if(Notification.permission==='granted'){el.textContent='✓ Notificaciones activadas';if(btn){btn.textContent='Activadas ✓';btn.disabled=true;}}
  else if(Notification.permission==='denied'){el.textContent='Bloqueadas. Activalas desde la config del navegador.';}
  else{el.textContent='Sin activar.';}
}
function activarNotificaciones(){
  if(!('Notification'in window)){alert('Tu navegador no soporta notificaciones');return;}
  Notification.requestPermission().then(perm=>{
    actualizarEstadoNotif();
    if(perm==='granted'){new Notification('Gestor de Deudas',{body:'¡Notificaciones activadas! Te avisaremos de los vencimientos.'});revisarVencimientos();}
  });
}
function revisarVencimientos(forzar){
  if(!('Notification'in window)||Notification.permission!=='granted'){if(forzar)alert('Primero activá las notificaciones');return;}
  const alertas=getAlertas();
  if(alertas.length===0){if(forzar)new Notification('Gestor de Deudas',{body:'Sin vencimientos en los próximos 3 días ✓'});return;}
  const hoy=alertas.filter(a=>a.diff===0);
  const proximos=alertas.filter(a=>a.diff>0);
  let body='';
  if(hoy.length)body+=`Vence HOY: ${hoy.map(a=>a.nombre).join(', ')}. `;
  if(proximos.length)body+=`Próximos: ${proximos.map(a=>`${a.nombre} (${a.diff}d)`).join(', ')}.`;
  new Notification('🔔 Vencimientos',{body});
}

function exportarMes(){
  const M=currentMonthIdx,A=CURRENT_YEAR;

  // Cuotas por persona
  personas.forEach(p=>{
    const items=deudas.filter(d=>d.persona===p&&getCuotaEnMes(d,M,A)!==null);
    if(!items.length)return;
    const tot=items.reduce((s,d)=>s+getMonto(d),0);
    txt+=`👤 ${p}: ${tot<0?'-':''}${fmt(tot)}\n`;
    items.forEach(d=>{
      const c=getCuotaEnMes(d,M,A);
      const cuotaStr=d.cuotaTotal===999?'Sub':c+'/'+d.cuotaTotal;
      txt+=`   • ${d.producto}: ${d.negativo?'-':''}${fmt(d.monto)} (${cuotaStr})\n`;
    });
    txt+=`\n`;
  });

  // Fijos
  const fijosAct=fijos.filter(f=>f.frecuencia!=='semanal'&&fijoActivoEnMes(f,M,A));
  const fijosSem=fijos.filter(f=>f.frecuencia==='semanal');
  if(fijosAct.length||fijosSem.length){
    txt+=`🏠 GASTOS FIJOS\n`;
    fijosAct.forEach(f=>{
      const paid=isPagado(f.id,M,A);
      txt+=`   ${paid?'✓':'○'} ${f.nombre}: ${fmt(f.monto)} (vence ${f.vencimiento})\n`;
    });
    fijosSem.forEach(f=>{
      const sems=getSemanasDelMes(f,M,A);
      const pag=sems.filter((_,i)=>isSemPagada(f.id,M,A,i)).length;
      txt+=`   ${f.nombre}: ${fmt(f.monto)}/sem × ${sems.length} = ${fmt(sems.length*f.monto)} (${pag}/${sems.length} pagadas)\n`;
    });
    txt+=`\n`;
  }

  const td=getTotalDeudaMes(M,A),tf=getTotalFijosMes(M,A);
  txt+=`${'─'.repeat(28)}\n`;
  txt+=`Cuotas: ${fmt(td)}\nFijos: ${fmt(tf)}\nTOTAL: ${fmt(td+tf)}`;

  navigator.clipboard.writeText(txt).then(()=>{
    const btns=[...document.querySelectorAll('button')].filter(b=>b.textContent.includes('Exportar'));
    if(btns[0]){const o=btns[0].innerHTML;btns[0].innerHTML='✓ Copiado';btns[0].style.color='#6f8';setTimeout(()=>{btns[0].innerHTML=o;btns[0].style.color='';},2000);}
  }).catch(()=>alert(txt));
}

function copiarPersona(p,m,a){

  const isSub=d=>d.cuotaTotal===999;
  let txt=`${p} - ${MONTHS[m]} ${a}\n`;

  });

function getAlertas(){
  const M=currentMonthIdx,A=CURRENT_YEAR;
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const alertas=[];
  fijos.forEach(f=>{
    if(f.frecuencia==='semanal'){
      const sems=getSemanasDelMes(f,M,A);
      sems.forEach((fecha,i)=>{
        if(isSemPagada(f.id,M,A,i))return;
        const diff=Math.ceil((fecha-hoy)/(1000*60*60*24));
        if(diff>=0&&diff<=3) alertas.push({nombre:f.nombre,fecha,diff,tipo:'semanal'});
      });
    } else if(fijoActivoEnMes(f,M,A)&&!isPagado(f.id,M,A)){
      const fecha=new Date(A,M,f.vencimiento);
      const diff=Math.ceil((fecha-hoy)/(1000*60*60*24));
      if(diff>=0&&diff<=3) alertas.push({nombre:f.nombre,fecha,diff,tipo:'fijo'});
    }
  });
  return alertas.sort((a,b)=>a.diff-b.diff);
}

function esMonto(s){return /^\d{1,3}(\.\d{3})*,\d{2}$/.test(s);}
function esMontoNeg(s){return /^\d{1,3}(\.\d{3})*,\d{2}-$/.test(s)||/^-\d{1,3}(\.\d{3})*,\d{2}$/.test(s);}
function parseMonto(s){return parseFloat(s.replace(/\./g,'').replace(',','.').replace(/-$/,'').replace(/^-/,''));}
function esFecha(s){return /^\d{2}\.\d{2}\.\d{2}$/.test(s);}
function esComprobante(s){return /^\d{5,7}[K*]?$/.test(s);}
function esMontoUSD(s){return /^\d{1,3}(\.\d{3})*,\d{2}$/.test(s)||/^\d+,\d{2}$/.test(s);}

// Descripciones a ignorar (no son consumos reales)
const DESC_IGNORAR=['SU PAGO','DEV.IMP','DB.RG','BONI MANT','COM MANT','SALDO ANT','PAGO EN','SU PAGO'];
function esDescIgnorar(desc){
  return DESC_IGNORAR.some(function(d){return desc.toUpperCase().includes(d);});
}

function esFechaMaster(s){
  // Formato: 25-Abr-26, 13-May-26, etc.
  return /^\d{2}-[A-Za-záéíóúÁÉÍÓÚ]{3}-\d{2}$/.test(s);
}
const MESES_MASTER={'Ene':0,'Feb':1,'Mar':2,'Abr':3,'May':4,'Jun':5,'Jul':6,'Ago':7,'Sep':8,'Set':8,'Oct':9,'Nov':10,'Dic':11};

function extraerMasterGalicia(items,nombre,mes,proximoCierreManual,fechaVencimientoManual){
  let proximoCierre=proximoCierreManual||'';
  let fechaVencimiento=fechaVencimientoManual||'';

  // Patrón Master: formato DD-Mmm-YY (con guiones)
  // [..., "23-Jul-26", "03-Ago-26", "PAGO MINIMO", "LÍMITES", ...]
  //         ↑ cierre      ↑ vencimiento
  // Buscar LÍMITES, subir: pos3=vencimiento, pos4=cierre
  const esFechaLargaMaster = s => /^\d{2}-[A-Za-záéíóú]{3}-\d{2}$/.test(s);

  if(!proximoCierre || !fechaVencimiento){
    // Patrón Master: "23-Jul-26", "03-Ago-26", "PAGO MINIMO", "LÍMITES"
    // Usamos "PAGO MINIMO" como ancla (sin acentos, más confiable)
    // Subiendo desde ahí: pos1=vencimiento, pos2=cierre
    let idxLim = -1;
    for(let k=0;k<items.length;k++){
      if(items[k].includes('PAGO MINIMO')||items[k].includes('PAGO MÍNIMO')){idxLim=k;break;}
    }
    if(idxLim > 0){
      const fechasEncontradas=[];
      for(let k=idxLim-1; k>=Math.max(0,idxLim-10); k--){
        if(esFechaLargaMaster(items[k])) fechasEncontradas.push(items[k]);
        if(fechasEncontradas.length>=2) break;
      }
      // fechasEncontradas[0] = más cercana = vencimiento
      // fechasEncontradas[1] = siguiente = cierre
      if(!fechaVencimiento && fechasEncontradas.length>=1) fechaVencimiento=fechasEncontradas[0];
      if(!proximoCierre && fechasEncontradas.length>=2) proximoCierre=fechasEncontradas[1];
    }
  }

  const cuotas=[];
  const unPago=[];

  // Arrancar desde COMPRAS DEL MES para evitar el SUBTOTAL previo
  const idxStart=items.findIndex(function(x){return x.includes('COMPRAS DEL MES');});
  if(idxStart===-1){alert('No se encontró la sección de consumos en el PDF');return;}

  let modo='';
  let i=idxStart;
  while(i<items.length){
    const it=items[i];

    if(it.includes('COMPRAS DEL MES')){modo='compras';i++;continue;}
    if(it.includes('CUOTA DEL MES')){modo='cuotas';i++;continue;}
    // Parar solo cuando ya estamos en modo y encontramos SUBTOTAL
    if(modo&&(it.startsWith('SUBTOTAL')||it==='TOTAL A PAGAR'||it.includes('OPCIONES DE')))break;

    if(esFechaMaster(it)&&modo){
      i++;
      if(i>=items.length)break;

      let desc='';
      let esCuota=false;
      let cuotaActual=0,cuotaTotal=0;

      while(i<items.length){
        const cur=items[i];
        if(esMonto(cur))break;
        if(/^\d{5}$/.test(cur)){i++;break;}
        if(/^\d+\/\d+$/.test(cur)){
          esCuota=true;
          const p=cur.split('/');
          cuotaActual=parseInt(p[0]);cuotaTotal=parseInt(p[1]);
          i++;continue;
        }
        if(esFechaMaster(cur)||cur.includes('SUBTOTAL'))break;
        desc+=cur+' ';
        i++;
      }
      desc=desc.trim().replace(/^[A-Z0-9]+\*/,'').substring(0,35).trim();

      if(i<items.length&&esMonto(items[i])){
        const monto=parseMonto(items[i]);
        i++;
        // Saltar columna dólares
        if(i<items.length&&esMonto(items[i]))i++;
        if(monto<=0||desc.length<2){continue;}

        if(esCuota||modo==='cuotas'){
          if(!esCuota){cuotaActual=1;cuotaTotal=1;}
          cuotas.push({descripcion:desc,cuotaActual:cuotaActual,cuotaTotal:cuotaTotal,monto:monto,posicion:i});
        } else {
          if(!esDescIgnorar(desc)){
            unPago.push({descripcion:desc,monto:monto,posicion:i});
          }
        }
      }
      continue;
    }
    i++;
  }

  if(cuotas.length===0&&unPago.length===0){
    alert('No se encontraron consumos. Cuotas='+cuotas.length+' UnPago='+unPago.length+'\nModo al terminar: '+modo);
    return;
  }

  const tarjeta={
    id:Date.now(),
    nombre:nombre.replace('.pdf','').replace('.PDF',''),
    tipo:'master-galicia',
    seccionesTarjeta:[{numero:'Principal',titular:'BORDESSOLLES',cuotas:cuotas}],
    unPago:unPago,
    fechaCarga:new Date().toLocaleDateString('es-AR'),
    proximoCierre:proximoCierre||undefined,
    fechaVencimiento:fechaVencimiento||undefined
  };

  if(!tarjetasPorMes[mes])tarjetasPorMes[mes]={};
  tarjetasPorMes[mes]['master-galicia-'+tarjeta.id]=tarjeta;
  guardar();
  renderTarjetas();
  const fMsg=(proximoCierre||fechaVencimiento)?`\nCierre: ${proximoCierre||'no detectado'} | Vto: ${fechaVencimiento||'no detectado'}`:'';
  alert('✓ '+cuotas.length+' cuotas y '+unPago.length+' consumos en 1 pago cargados'+fMsg);
}


function extraerCuotasDelPDF(items,nombre,tipo,mes,proximoCierreManual,fechaVencimientoManual){

  // ── Extraer fechas de cierre y vencimiento automáticamente ──────────
  // Patrón: antes de "LIMITES: COMPRA" (o "LIMITES:") hay dos fechas consecutivas:
  //   [..., "23 Jul 26", "21 May 26", monto, "03 Ago 26", "LIMITES: COMPRA", ...]
  //                       ↑ próximo cierre            ↑ próximo vencimiento
  // Según el texto del PDF:
  //   [PROXIMO CIERRE] aparece antes del vencimiento → buscamos el índice de "LIMITES"
  //   y tomamos las dos fechas más cercanas anteriores a él.
  let proximoCierre=proximoCierreManual||'';
  let fechaVencimiento=fechaVencimientoManual||'';

  const esFechaLarga = s => /^\d{2}\s[A-Za-záéíóú]{3}\s\d{2}$/.test(s); // "23 Jul 26"

  if(!proximoCierre || !fechaVencimiento){
    // Patrón real del PDF (verificado):
    // [..., "23 Jul 26", "21 May 26", "423850,00", "03 Ago 26", "1/ 3", "LIMITES: COMPRA", ...]
    //         ↑ próx. cierre                         ↑ próx. vencimiento
    //
    // Estrategia: encontrar LIMITES: COMPRA, luego ir hacia atrás
    // recolectando fechas "DD Mmm YY" ignorando todo lo demás.
    // La primera fecha encontrada (más cercana a LIMITES) = próximo vencimiento
    // La segunda fecha encontrada = próximo cierre

    let idxLim = -1;
    for(let k=0;k<items.length;k++){
      if(/LIMITES/i.test(items[k])){idxLim=k;break;}
    }

    if(idxLim > 0){
      // DEBUG: mostrar los 10 items antes de LIMITES en consola
      console.log('=== DEBUG fechas tarjeta ===');
      for(let k=idxLim-1;k>=Math.max(0,idxLim-10);k--){
        console.log(`pos ${idxLim-k}:`, JSON.stringify(items[k]), '| esFechaLarga:', esFechaLarga(items[k]));
      }
      const fechasEncontradas=[];
      for(let k=idxLim-1; k>=Math.max(0,idxLim-10); k--){
        if(esFechaLarga(items[k])) fechasEncontradas.push(items[k]);
        if(fechasEncontradas.length>=2) break;
      }
      // fechasEncontradas[0] = más cercana a LIMITES = próximo vencimiento
      // fechasEncontradas[1] = siguiente = próximo cierre
      if(!fechaVencimiento && fechasEncontradas.length>=1) fechaVencimiento=fechasEncontradas[0];
      if(!proximoCierre && fechasEncontradas.length>=2) proximoCierre=fechasEncontradas[1];
    }
  }
  // Paso 1: detectar marcadores "Tarjeta XXXX Total" que aparecen AL FINAL de cada sección
  const marcadores=[];
  for(let i=0;i<items.length;i++){
    if(/^Tarjeta \d{4} Total$/.test(items[i])){
      const num=items[i].match(/(\d{4})/)[1];
      let titular='';
      for(let j=i+1;j<Math.min(i+10,items.length);j++){
        if(items[j]==='_'||/^\d{1,3}(\.\d{3})*,\d{2}/.test(items[j]))break;
        if(['de','Consumos','Total','0,00'].includes(items[j]))continue;
        titular+=items[j]+' ';
      }
      marcadores.push({numero:num,titular:titular.trim(),posicion:i});
    }
  }

  // Paso 2: parsear transacciones con su posición en el array
  const cuotas=[];
  const unPago=[];
  const bonificaciones=[];

  // getSeccion: el marcador está AL FINAL de su sección
  // item pertenece al PRIMER marcador cuya posición es MAYOR a la del item
  function getSeccion(pos){
    if(marcadores.length===0)return{numero:'???',titular:'Principal'};
    for(var mi=0;mi<marcadores.length;mi++){
      if(marcadores[mi].posicion>pos)return marcadores[mi];
    }
    return marcadores[marcadores.length-1];
  }

  let i=0;
  while(i<items.length){
    if(esFecha(items[i])){
      const posActual=i;
      i++;
      if(i>=items.length)break;
      if(!esComprobante(items[i])){continue;}
      i++;

      let desc='';
      let esCuota=false;
      let cuotaActual=0,cuotaTotal=0;
      let esUSD=false;
      let montoUSDVal=0;

      while(i<items.length){
        if(esMonto(items[i])||esMontoNeg(items[i]))break;
        if(esFecha(items[i])||items[i]==='_')break;
        // Detectar USD como item separado: [USD] [800,66]
        if(items[i]==='USD'){
          esUSD=true; i++;
          if(i<items.length&&esMontoUSD(items[i])){
            montoUSDVal=parseMonto(items[i]);
            i++;
          }
          // Saltar el monto en pesos que viene después (si es que viene)
          if(i<items.length&&esMonto(items[i]))i++;
          break;
        }
        // Detectar USD pegado al final de la descripción: "CLAUDE.AI SUBSCR in1TZ9LeBUSD"
        if(items[i].endsWith('USD')&&items[i].length>3){
          esUSD=true;
          desc+=items[i].replace(/USD$/,'').trim()+' ';
          i++;
          // El primer monto es el USD, el segundo (si existe) es el en pesos — ignoramos el de pesos
          if(i<items.length&&esMontoUSD(items[i])){
            montoUSDVal=parseMonto(items[i]);
            i++;
            // Saltar segundo monto (pesos)
            if(i<items.length&&esMonto(items[i]))i++;
          }
          break;
        }
        if(items[i]==='Cuota'){
          esCuota=true;i++;
          if(i<items.length&&/^\d+\/\d+$/.test(items[i])){
            const p=items[i].split('/');
            cuotaActual=parseInt(p[0]);cuotaTotal=parseInt(p[1]);i++;
          }
          break;
        }
        desc+=items[i]+' ';
        i++;
      }
      desc=desc.trim().replace(/^[A-Z0-9]+\*/,'').substring(0,35).trim();

      // Si es USD, guardar con monto en dólares
      if(esUSD){
        if(montoUSDVal>0&&!esDescIgnorar(desc)&&desc.length>1){
          unPago.push({descripcion:desc,monto:montoUSDVal,montoUSD:true,posicion:posActual});
        }
        continue;
      }

      if(i<items.length&&esMonto(items[i])){
        const monto=parseMonto(items[i]);
        i++;
        if(monto<=0)continue;
        // Ignorar si es pago/devolución/etc
        if(esDescIgnorar(desc))continue;
        if(desc.length<2)continue;

        if(esCuota){
          cuotas.push({descripcion:desc,cuotaActual,cuotaTotal,monto,posicion:posActual});
        } else {
          unPago.push({descripcion:desc,monto,posicion:posActual});
        }
      } else if(i<items.length&&esMontoNeg(items[i])){
        // Monto negativo = bonificación
        const monto=parseMonto(items[i]);
        i++;
        if(monto>0&&desc.length>=2&&!esDescIgnorar(desc)){
          bonificaciones.push({descripcion:desc,monto,posicion:posActual});
        }
      }
      continue;
    }
    i++;
  }

  if(cuotas.length===0&&unPago.length===0){alert('No se encontraron consumos en el PDF');return;}

  // Paso 3 → Paso 4: agrupar
  const porTarjeta={};
  marcadores.forEach(m=>{porTarjeta[m.numero]={numero:m.numero,titular:m.titular,cuotas:[]};});
  if(Object.keys(porTarjeta).length===0)porTarjeta['???']={numero:'???',titular:'Principal',cuotas:[]};

  cuotas.forEach(c=>{
    const sec=getSeccion(c.posicion);
    if(!porTarjeta[sec.numero])porTarjeta[sec.numero]={numero:sec.numero,titular:sec.titular,cuotas:[]};
    porTarjeta[sec.numero].cuotas.push(c);
  });

  const unPagoAgrupado=unPago.map(c=>({...c,seccion:getSeccion(c.posicion).numero}));
  const bonificacionesAgrupadas=bonificaciones.map(c=>({...c,seccion:getSeccion(c.posicion).numero}));

  const tarjeta={
    id:Date.now(),
    nombre:nombre.replace('.pdf',''),
    tipo:tipo,
    seccionesTarjeta:Object.values(porTarjeta),
    unPago:unPagoAgrupado,
    bonificaciones:bonificacionesAgrupadas,
    fechaCarga:new Date().toLocaleDateString('es-AR'),
    proximoCierre:proximoCierre||undefined,
    fechaVencimiento:fechaVencimiento||undefined
  };
  
  // Guardar en tarjetasPorMes
  if(!tarjetasPorMes[mes])tarjetasPorMes[mes]={};
  const idTarjeta=`${tipo}-${tarjeta.id}`;
  tarjetasPorMes[mes][idTarjeta]=tarjeta;
  
  guardar();
  renderTarjetas();
  const bMsg=bonificacionesAgrupadas.length>0?' y '+bonificacionesAgrupadas.length+' bonificaciones':'';
  const fMsg=(proximoCierre||fechaVencimiento)?`\nCierre: ${proximoCierre||'no detectado'} | Vto: ${fechaVencimiento||'no detectado'}`:'';
  alert('✓ '+cuotas.length+' cuotas, '+unPago.length+' consumos en 1 pago'+bMsg+' cargados'+fMsg);
}

// Calcula, para cada tarjeta cargada, qué cuotas van a llegar a su última cuota
// en cada uno de los próximos 6 meses contados desde el mes que se está viendo (M,A),
// y cuánto crédito se libera en consecuencia.
function renderProyeccionFinalizacion(M,A){
  // Tomamos como base las cuotas vigentes registradas en el mes que se está viendo (M,A)
  const mesKeyVisto=A+'-'+String(M+1).padStart(2,'0');
  let baseObj=tarjetasPorMes[mesKeyVisto]||{};
  let baseM=M, baseA=A;

  // Si no hay carga en ese mes exacto, buscamos la carga más reciente disponible hacia atrás desde (M,A)
  if(Object.keys(baseObj).length===0){
    for(let back=1;back<=12;back++){
      let bm=M-back, ba=A;
      if(bm<0){bm+=12;ba-=1;}
      const k=ba+'-'+String(bm+1).padStart(2,'0');
      if(tarjetasPorMes[k]&&Object.keys(tarjetasPorMes[k]).length>0){
        baseObj=tarjetasPorMes[k]; baseM=bm; baseA=ba; break;
      }
    }
  }

  if(Object.keys(baseObj).length===0) return '';

  // offset = cuántos meses pasaron desde la carga base hasta el mes que se está viendo (M,A)
  const offsetBase=(A*12+M)-(baseA*12+baseM);

  // Para cada uno de los próximos 6 meses (desde el mes que se está viendo M,A)
  const meses=[];
  for(let n=0;n<6;n++){
    let mm=M+n, aa=A;
    while(mm>11){mm-=12;aa+=1;}
    meses.push({m:mm,a:aa,offset:offsetBase+n});
  }

  // Recorremos todas las tarjetas/cuotas de la carga base y proyectamos
  const porMes=meses.map(()=>({monto:0,items:[]}));
  Object.entries(baseObj).forEach(([key,t])=>{
    (t.seccionesTarjeta||[]).forEach(sec=>{
      (sec.cuotas||[]).forEach(c=>{
        if(!c.cuotaTotal||c.cuotaTotal<=1) return; // ignorar consumos en 1 pago
        meses.forEach((mes,idx)=>{
          const cuotaProyectada=c.cuotaActual+mes.offset;
          if(cuotaProyectada===c.cuotaTotal){
            porMes[idx].monto+=c.monto;
            porMes[idx].items.push({nombre:t.nombre,desc:c.descripcion,monto:c.monto,cuotaTotal:c.cuotaTotal});
          }
        });
      });
    });
  });

  const totalLiberado=porMes.reduce((s,p)=>s+p.monto,0);
  if(totalLiberado===0){
    return '<div class="section-divider">🔓 Próximos consumos a finalizar</div>'
      +'<div class="card"><p style="font-size:12px;color:#666">No hay cuotas que finalicen en los próximos 6 meses (con los datos cargados).</p></div>';
  }

  let html='<div class="section-divider">🔓 Próximos consumos a finalizar</div>'
    +'<div class="card">'
    +'<p style="font-size:11px;color:#999;margin-bottom:10px">Cuánto crédito se libera por cuotas que terminan, mes a mes, a partir de '+MONTHS[M]+' '+A+'.</p>'
    +'<table style="width:100%;border-collapse:collapse;font-size:12px">'
    +'<thead><tr><th style="text-align:left;padding:6px">Mes</th><th style="text-align:right;padding:6px">Se libera</th><th style="text-align:left;padding:6px">Detalle</th></tr></thead><tbody>';

  meses.forEach((mes,idx)=>{
    const p=porMes[idx];
    const esMesVisto=idx===0;
    html+='<tr style="border-top:1px solid #2a2a2a'+(esMesVisto?';background:#1a2a1a':'')+'">'
      +'<td style="padding:6px;font-weight:'+(esMesVisto?'600':'400')+'">'+MONTHS[mes.m]+' '+mes.a+(esMesVisto?' <span style="font-size:10px;color:#6f8">(seleccionado)</span>':'')+'</td>'
      +'<td style="text-align:right;padding:6px;color:'+(p.monto>0?'#6f8':'#555')+';font-weight:'+(p.monto>0?'600':'400')+'">'+(p.monto>0?fmt(p.monto):'—')+'</td>'
      +'<td style="padding:6px;font-size:11px;color:#999">'
        +(p.items.length>0?p.items.map(it=>it.nombre+': '+it.desc+' ('+it.cuotaTotal+'/'+it.cuotaTotal+')').join('<br>'):'')
      +'</td>'
    +'</tr>';
  });

  html+='<tr style="border-top:2px solid #444;background:#141414"><td style="padding:6px;font-weight:700">Total 6 meses</td>'
    +'<td style="text-align:right;padding:6px;font-weight:700;color:#6f8">'+fmt(totalLiberado)+'</td><td></td></tr>';

  html+='</tbody></table></div>';
  return html;
}

async function procesarPDFConTipo(file){
  const tipoEl=document.getElementById('tipo-tarjeta');
  const mesEl=document.getElementById('mes-tarjeta');
  const passEl=document.getElementById('pdf-password');
  const proximoCierreEl=document.getElementById('proximo-cierre');

  if(!tipoEl||!mesEl){alert('Error: recargá la página.');return;}
  const tipo=tipoEl.value;
  const mes=mesEl.value;
  // Para Visa Patagonia, usar siempre la clave por defecto si el campo está vacío
  let password=passEl?passEl.value.trim():'';
  if(!password&&tipo==='visa-patagonia') password='32151766';
  if(!tipo||!mes){alert('Seleccioná tarjeta y mes');return;}
  if(!file){alert('No se seleccionó ningún archivo');return;}
  const reader=new FileReader();
  reader.onerror=()=>alert('Error leyendo el archivo');
  reader.onload=async e=>{
    try{
      if(typeof pdfjsLib==='undefined'){alert('La librería de PDF no se cargó. Verificá tu conexión y recargá la página.');return;}
      const pdfData=new Uint8Array(e.target.result);
      const loadParams={data:pdfData};
      if(password)loadParams.password=password;
      let pdf;
      try{
        pdf=await pdfjsLib.getDocument(loadParams).promise;
      }catch(err){
        if(err.name==='PasswordException'||err.message.toLowerCase().includes('password')){
          const pass=prompt('El PDF está protegido. Ingresá la contraseña:',(passEl?passEl.value:''));
          if(!pass)return;
          pdf=await pdfjsLib.getDocument({data:pdfData,password:pass}).promise;
        } else { throw err; }
      }
      const items=[];
      for(let i=1;i<=pdf.numPages;i++){
        const page=await pdf.getPage(i);
        const content=await page.getTextContent();
        content.items.forEach(it=>{const s=it.str.replace(/\s+/g,' ').trim();if(s)items.push(s);});
      }
      if(items.length===0){alert('El PDF no contiene texto legible');return;}
      if(tipo==='master-galicia'){extraerMasterGalicia(items,file.name,mes,proximoCierreEl?.value,fechaVencimientoEl?.value);}
      else{extraerCuotasDelPDF(items,file.name,tipo,mes,proximoCierreEl?.value,fechaVencimientoEl?.value);}
    }catch(err){alert('Error procesando PDF: '+err.message);console.error(err);}
  };
  reader.readAsArrayBuffer(file);
}

function eliminarTarjetaMes(mes,key){
  if(!tarjetasPorMes[mes]||!tarjetasPorMes[mes][key])return;
  const t=tarjetasPorMes[mes][key];
  if(!confirm('¿Eliminar tarjeta "'+t.nombre+'"?'))return;
  delete tarjetasPorMes[mes][key];
  if(Object.keys(tarjetasPorMes[mes]).length===0)delete tarjetasPorMes[mes];
  guardar();
  renderTarjetas();
}


// ── Estadísticas ─────────────────────────────────────────────────────
function renderStats(){
  const A=CURRENT_YEAR;
  // Totales por mes
  const meses=Array.from({length:12},(_,i)=>i);
  const totDeuda=meses.map(m=>getTotalDeudaMes(m,A));
  const totFijos=meses.map(m=>getTotalFijosMes(m,A));
  const totales=meses.map(m=>totDeuda[m]+totFijos[m]);
  const maxVal=Math.max(...totales,1);

  // Personas y sus totales restantes
  const personas=getPersonas();
  const restoPersonas=personas.map(p=>{
    const total=deudas.filter(d=>d.persona===p&&d.cuotaTotal!==999)
      .reduce((s,d)=>{const r=d.cuotaTotal-d.cuotaInicio+1;return s+(d.negativo?-1:1)*d.monto*r;},0);
    return{p,total};
  }).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);
  const maxResto=Math.max(...restoPersonas.map(x=>x.total),1);

  // Mes con más gasto
  const mesPico=totales.indexOf(Math.max(...totales));

  let html=`<div class="card">
    <div class="card-header"><span class="card-title">📊 Totales por mes — ${A}</span></div>
    <div style="overflow-x:auto;">
      <table style="min-width:500px"><thead><tr>
        <th>Mes</th><th style="text-align:right">Cuotas</th><th style="text-align:right">Fijos</th><th style="text-align:right">Total</th><th style="width:35%">Barra</th>
      </tr></thead><tbody>`;
  meses.forEach(m=>{
    const t=totales[m],pct=Math.round(t/maxVal*100);
    const esCurrent=m===currentMonthIdx;
    html+=`<tr style="${esCurrent?'background:#1a2a1a':''}">
      <td style="font-size:12px;${esCurrent?'color:#6f8;font-weight:500':''}">${MONTHS[m].substring(0,3)}</td>
      <td style="text-align:right;font-size:12px">${fmt(totDeuda[m])}</td>
      <td style="text-align:right;font-size:12px;color:#f88">${fmt(totFijos[m])}</td>
      <td style="text-align:right;font-size:12px;font-weight:500">${fmt(t)}</td>
      <td><div style="background:#333;border-radius:3px;height:10px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${esCurrent?'#6f8':'#378ADD'};border-radius:3px;"></div>
      </div></td>
    </tr>`;
  });
  html+=`</tbody></table></div></div>`;

  // Deuda restante por persona
  if(restoPersonas.length){
    html+=`<div class="card" style="margin-top:1rem">
      <div class="card-header"><span class="card-title">👥 Deuda total restante por persona</span></div>`;
    restoPersonas.forEach(({p,total})=>{
      const pct=Math.round(total/maxResto*100);
      // Cuántos meses faltan aprox
      const mesesFaltan=deudas.filter(d=>d.persona===p&&d.cuotaTotal!==999)
        .reduce((max,d)=>Math.max(max,d.cuotaTotal-d.cuotaInicio),0);
      html+=`<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:13px">${p}</span>
          <span style="font-size:13px;font-weight:500">${fmt(total)}</span>
        </div>
        <div style="background:#333;border-radius:4px;height:12px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:#378ADD;border-radius:4px;"></div>
        </div>
        <div style="font-size:11px;color:#666;margin-top:3px">~${mesesFaltan} cuotas restantes</div>
      </div>`;
    });
    html+=`</div>`;
  }

  // Alertas vencimiento
  const alertas=getAlertas();
  html+=`<div class="card" style="margin-top:1rem">
    <div class="card-header"><span class="card-title">🔔 Vencimientos próximos</span></div>`;
  if(alertas.length===0){
    html+=`<p style="font-size:13px;color:#666;">Sin vencimientos en los próximos 3 días ✓</p>`;
  } else {
    alertas.forEach(a=>{
      const color=a.diff===0?'#f88':a.diff===1?'#fa0':'#6f8';
      const label=a.diff===0?'HOY':a.diff===1?'MAÑANA':`en ${a.diff} días`;
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #333">
        <span style="font-size:13px">${a.nombre}</span>
        <span style="font-size:12px;font-weight:500;color:${color};">${label}</span>
      </div>`;
    });
  }
  html+=`</div>`;

  // ── Proyección fin de pago ──
  const proyeccion=personas.map(p=>{
    const items=deudas.filter(d=>d.persona===p&&d.cuotaTotal!==999);
    if(!items.length)return null;
    // Para cada deuda, mes de la última cuota
    let maxMes=-1;
    items.forEach(d=>{
      const cuotasRest=d.cuotaTotal-d.cuotaInicio; // cuántas faltan desde el inicio
      const mesFin=(d.anoInicio||2026)*12+d.mesInicio+cuotasRest;
      if(mesFin>maxMes)maxMes=mesFin;
    });
    return{p,anio:Math.floor(maxMes/12),mes:maxMes%12,raw:maxMes};
  }).filter(Boolean).sort((a,b)=>a.raw-b.raw);

  if(proyeccion.length){
    const ahora=CURRENT_YEAR*12+CURRENT_MONTH;
    html+=`<div class="card" style="margin-top:1rem">
      <div class="card-header"><span class="card-title">🏁 Proyección de fin de pago</span></div>`;
    proyeccion.forEach(({p,anio,mes,raw})=>{
      const mesesRest=raw-ahora;
      const terminado=mesesRest<0;
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #333">
        <span style="font-size:13px">${p}</span>
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:500;color:${terminado?'#6f8':'#fff'}">${terminado?'✓ Saldado':`${MONTHS[mes]} ${anio}`}</div>
          ${terminado?'':`<div style="font-size:11px;color:#666">faltan ${mesesRest} ${mesesRest===1?'mes':'meses'}</div>`}
        </div>
      </div>`;
    });
    html+=`</div>`;
  }

  // ── Resumen general ──
  const totalAcum=totales.reduce((s,t)=>s+t,0);
  html+=`<div class="grand-total" style="margin-top:1rem">
    <strong>Resumen ${A}</strong><br>
    Total anual estimado: <strong>${fmt(totalAcum)}</strong> |
    Mes pico: <strong>${MONTHS[mesPico]}</strong> (${fmt(totales[mesPico])})
  </div>`;

  document.getElementById('view-stats').innerHTML=html;
}

function aplicarEstado(estado){
  deudas      = migrateDeudas(estado.deudas || DEFAULT_DEUDAS);
  categorias  = estado.categorias || DEFAULT_CATS;
  pagados     = estado.pagados || {};
  saldados    = estado.saldados || {};
  tarjetasPorMes = estado.tarjetasPorMes || {};
  const sf    = estado.fijos;
  if(sf&&sf.length>0){
    fijos = migrateFijos(sf);
    const existIds=fijos.map(f=>f.id);
    DEFAULT_FIJOS.forEach(df=>{if(!existIds.includes(df.id))fijos.push(df);});
  } else {
    fijos = DEFAULT_FIJOS;
  }
  if(!categorias.find(c=>c.id===207)) categorias.push({id:207,nombre:'Tahiel',color:'#D4537E'});
}

async function init(){
  // Mostrar indicador de carga
  const b=document.getElementById('save-badge');
  if(b){b.textContent='⏳ Cargando...';b.className='save-badge save-err';b.style.display='inline';}

  // Intentar cargar desde Sheets
  const estadoSheets = await cargarSheets();

  if(estadoSheets && estadoSheets.deudas){
    aplicarEstado(estadoSheets);
    if(b){b.textContent='☁ Datos cargados';b.className='save-badge save-ok';b.style.display='inline';setTimeout(()=>b.style.display='none',2500);}
  } else {
    // Fallback a localStorage
    const sd=load('gd-deudas'),sc=load('gd-cats'),sf=load('gd-fijos'),sp=load('gd-pagados'),ss=load('gd-saldados');
    aplicarEstado({deudas:sd,categorias:sc,fijos:sf,pagados:sp,saldados:ss});
    if(b){b.textContent='💾 Datos locales';b.className='save-badge save-err';b.style.display='inline';setTimeout(()=>b.style.display='none',2500);}
  }

  renderResumen();
  // Revisar vencimientos al abrir (si están activadas las notificaciones)
  setTimeout(()=>revisarVencimientos(),1500);
}

modoLectura=false; iniciarApp();
