<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tester Google Sheets</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
  input { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { width: 100%; padding: 10px; background: #4F46E5; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
  button:hover { background: #4338CA; }
  #log { background: #f4f4f4; border-radius: 6px; padding: 14px; font-family: monospace; font-size: 12px; white-space: pre-wrap; min-height: 80px; margin-top: 16px; }
  .ok  { color: #16a34a; }
  .err { color: #dc2626; }
</style>
</head>
<body>

<h2>Tester Google Sheets</h2>

<label>Descripción</label>
<input id="desc" value="Gasto de prueba" />

<label>Monto</label>
<input id="monto" type="number" value="1234" />

<label>Categoría</label>
<input id="cat" value="Test" />

<button onclick="enviar()">Enviar a Sheets (POST no-cors)</button>
<button onclick="testGet()" style="background:#059669;">Probar conexión (GET)</button>

<div id="log">Esperando...</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwyEg7W8O6UiHTyTI-nxPrjLVKZ0zb9Dx6W7Y8Amlda8x-7ffiGULJxzrDBXdCzvGnFYw/exec";

function log(msg, cls) {
  const el = document.getElementById('log');
  el.textContent = msg;
  el.className = cls || '';
}

async function testGet() {
  log('Probando GET...');
  try {
    const r = await fetch(URL);
    const text = await r.text();
    log('✓ Respuesta:\n' + text, 'ok');
  } catch(e) {
    log('✗ Error GET: ' + e.message, 'err');
  }
}

async function enviar() {
  const data = {
    descripcion: document.getElementById('desc').value,
    monto: parseFloat(document.getElementById('monto').value),
    categoria: document.getElementById('cat').value
  };
  log('Enviando...\n' + JSON.stringify(data, null, 2));
  try {
    await fetch(URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    log('✓ Enviado (no-cors, sin respuesta legible).\n\nAbrí tu Google Sheet y fijate si apareció la fila nueva.\n\nSi aparece → funciona ✓\nSi no aparece → hay un error en el script.', 'ok');
  } catch(e) {
    log('✗ Error POST: ' + e.message, 'err');
  }
}
</script>
</body>
</html>
