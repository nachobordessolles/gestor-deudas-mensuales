<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Deudas y Gastos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 1rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
    .tab {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: #aaa;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .tab.active {
      background: #2a5a3a;
      color: #fff;
      border-color: #4a7a5a;
    }
    .card {
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-title {
      font-size: 15px;
      font-weight: 500;
    }
    .card-title.saldado {
      text-decoration: line-through;
      color: #666;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 1rem;
    }
    th {
      text-align: left;
      padding: 8px;
      color: #999;
      font-weight: 500;
      border-bottom: 1px solid #333;
      background: #1a1a1a;
    }
    td {
      padding: 8px;
      border-bottom: 1px solid #333;
    }
    tr.paid td { color: #666; text-decoration: line-through; }
    tr.total-row td {
      font-weight: 500;
      background: #1a1a1a;
      border-top: 1px solid #444;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 500;
    }
    .badge-saldado { background: #2a5a3a; color: #6f8;  }
    .badge-pos { background: #1a3a2a; color: #6f8; }
    .badge-neg { background: #3a1a2a; color: #f88; }
    .metric {
      background: #1a1a1a;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
    }
    .metric-label { font-size: 11px; color: #999; margin-bottom: 4px; }
    .metric-value { font-size: 18px; font-weight: 500; }
    .metric-value.neg { color: #f88; }
    .metric-value.pos { color: #6f8; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .month-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
      justify-content: center;
    }
    .month-nav button {
      background: #333;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .month-label {
      font-size: 14px;
      font-weight: 500;
      min-width: 120px;
      text-align: center;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font-size: 11px;
      color: #999;
    }
    input, select {
      background: #333;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    button {
      background: #2a5a3a;
      border: 1px solid #3a7a4a;
      color: #fff;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    button:hover { background: #3a7a4a; }
    button.danger {
      background: #5a2a2a;
      border-color: #7a4a4a;
      color: #f88;
    }
    button.danger:hover { background: #7a4a4a; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #6f8;
    }
    .inline-input {
      width: 50px;
      padding: 3px 4px;
      text-align: center;
      background: #333;
      border: 1px solid #444;
      color: #fff;
    }
    .edit-row td { background: #2a3a4a; }
    .grand-total {
      background: #1a1a1a;
      border-radius: 6px;
      padding: 14px;
      margin-top: 1rem;
      border: 1px solid #333;
    }
    .section-divider {
      font-size: 11px;
      font-weight: 500;
      color: #999;
      padding: 10px 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }
    .save-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      display: none;
      white-space: nowrap;
    }
    .save-ok { background: #2a5a3a; color: #6f8; }
    .save-err { background: #5a2a2a; color: #f88; }
    .hide { display: none !important; }
    .chip {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      background: #333;
      color: #999;
      border-radius: 3px;
      margin-left: 4px;
    }
    .chip.last { background: #2a5a3a; color: #6f8; }
  </style>
</head>
<body>
<div class="container">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 8px;">
    <h1 style="font-size: 20px;">Gestor de Deudas</h1>
    <span id="save-badge" class="save-badge"></span>
  </div>
  
  <div class="tabs" id="tabs">
    <button class="tab active" onclick="setView('resumen')">📅 Mes</button>
    <button class="tab" onclick="setView('detalle')">👥 Personas</button>
    <button class="tab" onclick="setView('lista')">📋 Cuotas</button>
    <button class="tab" onclick="setView('fijos')">🏠 Fijos</button>
    <button class="tab" onclick="setView('categorias')">🏷 Categorías</button>
    <button class="tab" onclick="setView('agregar')">➕ Agregar</button>
  </div>

  <div id="view-resumen"></div>
  <div id="view-detalle" class="hide"></div>
  <div id="view-lista" class="hide"></div>
  <div id="view-fijos" class="hide"></div>
  <div id="view-categorias" class="hide"></div>
  <div id="view-agregar" class="hide"></div>
</div>

<script>
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const FREQ_LABEL={mensual:'Mensual',bimestral:'Bimestral',trimestral:'Trimestral',semestral:'Semestral',anual:'Anual'};
const FREQ_MONTHS={mensual:1,bimestral:2,trimestral:3,semestral:6,anual:12};
const CAT_COLORS=['#378ADD','#1D9E75','#D85A30','#7F77DD','#D4537E','#BA7517','#639922','#E24B4A','#888780'];

const TODAY=new Date();
const CURRENT_MONTH=TODAY.getMonth();
const CURRENT_YEAR=TODAY.getFullYear();

let currentView='resumen', currentMonthIdx=CURRENT_MONTH;
let deudas=[],fijos=[],pagados={},categorias=[],saldados={};
let editingId=null,editingFijoId=null,saveTimer=null;

const DEFAULT_DEUDAS=[
  {id:1,persona:'Ramón',producto:'PS5',cuotaInicio:10,cuotaTotal:18,monto:71612,mesInicio:4,anoInicio:2026,negativo:false},
  {id:2,persona:'Ramón',producto:'Joystick',cuotaInicio:5,cuotaTotal:18,monto:9055,mesInicio:4,anoInicio:2026,negativo:false},
  {id:3,persona:'Ramón',producto:'Cable',cuotaInicio:2,cuotaTotal:6,monto:10653,mesInicio:4,anoInicio:2026,negativo:false},
  {id:4,persona:'Ramón',producto:'Colchón',cuotaInicio:1,cuotaTotal:18,monto:66274,mesInicio:5,anoInicio:2026,negativo:false},
  {id:5,persona:'Ramón',producto:'Tele',cuotaInicio:1,cuotaTotal:12,monto:150000,mesInicio:6,anoInicio:2026,negativo:false},
  {id:6,persona:'Seba',producto:'Ruedas',cuotaInicio:5,cuotaTotal:6,monto:40917,mesInicio:4,anoInicio:2026,negativo:false},
  {id:7,persona:'Seba',producto:'Gabeta',cuotaInicio:3,cuotaTotal:6,monto:106415,mesInicio:4,anoInicio:2026,negativo:false},
  {id:8,persona:'Seba',producto:'Luces',cuotaInicio:1,cuotaTotal:6,monto:24458,mesInicio:5,anoInicio:2026,negativo:false},
  {id:9,persona:'Fabio',producto:'Silla',cuotaInicio:1,cuotaTotal:6,monto:21519,mesInicio:4,anoInicio:2026,negativo:false},
  {id:10,persona:'Daro',producto:'VR',cuotaInicio:1,cuotaTotal:6,monto:130936,mesInicio:5,anoInicio:2026,negativo:false},
  {id:11,persona:'Lidia',producto:'Monopatín',cuotaInicio:9,cuotaTotal:18,monto:72834,mesInicio:4,anoInicio:2026,negativo:true},
  {id:12,persona:'Pablo',producto:'Juegos PS5',cuotaInicio:5,cuotaTotal:18,monto:16672,mesInicio:4,anoInicio:2026,negativo:false},
  {id:13,persona:'Pablo',producto:'Lectora PS5',cuotaInicio:5,cuotaTotal:12,monto:27917,mesInicio:4,anoInicio:2026,negativo:false},
  {id:14,persona:'Pablo',producto:'Silla',cuotaInicio:17,cuotaTotal:18,monto:15451,mesInicio:4,anoInicio:2026,negativo:false},
  {id:15,persona:'Pablo',producto:'Entradas',cuotaInicio:1,cuotaTotal:3,monto:43125,mesInicio:4,anoInicio:2026,negativo:false},
  {id:16,persona:'Pablo',producto:'HBO',cuotaInicio:1,cuotaTotal:999,monto:4061,mesInicio:4,anoInicio:2026,negativo:true},
  {id:17,persona:'Pablo',producto:'Spotify',cuotaInicio:1,cuotaTotal:999,monto:3654,mesInicio:4,anoInicio:2026,negativo:true},
  {id:18,persona:'Pablo',producto:'YouTube',cuotaInicio:1,cuotaTotal:999,monto:3013,mesInicio:4,anoInicio:2026,negativo:true},
];
const DEFAULT_CATS=[
  {id:201,nombre:'Servicios',color:'#378ADD'},
  {id:202,nombre:'Vivienda',color:'#1D9E75'},
  {id:203,nombre:'Impuestos',color:'#D85A30'},
  {id:204,nombre:'Seguros',color:'#7F77DD'},
  {id:205,nombre:'Transporte',color:'#BA7517'},
  {id:206,nombre:'Salud',color:'#D4537E'},
  {id:207,nombre:'Tahiel',color:'#D4537E'},
];
const DEFAULT_FIJOS=[
  {id:301,nombre:'Karate',monto:25000,frecuencia:'mensual',vencimiento:30,mesBase:5,anoBase:2026,categoriaId:207},
  {id:302,nombre:'Colegio',monto:91000,frecuencia:'mensual',vencimiento:10,mesBase:5,anoBase:2026,categoriaId:207},
  {id:303,nombre:'Saudachi',monto:41000,frecuencia:'mensual',vencimiento:10,mesBase:5,anoBase:2026,categoriaId:207},
];

function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));return true;}catch(e){return false;}}
function load(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}}
function migrateDeudas(arr){return arr.map(d=>({...d, anoInicio: d.anoInicio || 2026}));}
function migrateFijos(arr){return arr.map(f=>({...f, anoBase: f.anoBase || 2026}));}
function fmt(n){return '$'+Math.round(Math.abs(n)).toLocaleString('es-AR');}

function getCuotaEnMes(d,m,a){
  const mesActual = a*12 + m;
  const mesDeuda  = (d.anoInicio||2026)*12 + d.mesInicio;
  const o = mesActual - mesDeuda;
  if(o<0) return null;
  const c = d.cuotaInicio + o;
  return c > d.cuotaTotal ? null : c;
}
function getPersonas(){return[...new Set(deudas.map(d=>d.persona))];}
function getMonto(d){return d.negativo?-d.monto:d.monto;}
function fijoActivoEnMes(f,m,a){const mesActual=(a)*12+m;const mesBase=((f.anoBase||2026))*12+f.mesBase;const o=mesActual-mesBase;return o>=0&&o%FREQ_MONTHS[f.frecuencia]===0;}
function pagoKey(id,m,a){return`${id}-${m}-${a}`;}
function isPagado(id,m,a){return!!(pagados[pagoKey(id,m,a)]);}
function togglePago(id,m,a){const k=pagoKey(id,m,a);if(pagados[k])delete pagados[k];else pagados[k]=true;guardar();renderFijos();renderResumen();}
function getCatById(id){return categorias.find(c=>c.id===id)||{nombre:'General',color:'#888780'};}
function getTotalDeudaMes(m,a){return deudas.reduce((s,d)=>{const c=getCuotaEnMes(d,m,a);return c!==null?s+getMonto(d):s;},0);}
function getTotalFijosMes(m,a){return fijos.reduce((s,f)=>fijoActivoEnMes(f,m,a)?s+f.monto:s,0);}
function getTotalFijosPend(m,a){return fijos.filter(f=>fijoActivoEnMes(f,m,a)&&!isPagado(f.id,m,a)).reduce((s,f)=>s+f.monto,0);}
function catSelectOptions(sid){return categorias.map(c=>`<option value="${c.id}"${c.id===sid?' selected':''}>${c.nombre}</option>`).join('');}
function saldoKey(p,m,a){return`${p}-${m}-${a}`;}
function isSaldado(p,m,a){return!!saldados[saldoKey(p,m,a)];}
function toggleSaldado(p,m,a){const k=saldoKey(p,m,a);if(saldados[k])delete saldados[k];else saldados[k]=true;guardar();renderResumen();}

function showBadge(ok){
  const b=document.getElementById('save-badge');if(!b)return;
  b.textContent=ok?'✓ Guardado':'Error';
  b.className='save-badge '+(ok?'save-ok':'save-err');
  b.style.display='inline';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{b.style.display='none';},2000);
}
function guardar(){
  const ok=save('gd-deudas',deudas)&&save('gd-fijos',fijos)&&save('gd-pagados',pagados)&&save('gd-cats',categorias)&&save('gd-saldados',saldados);
  showBadge(ok);
}

function renderResumen(){
  const M=currentMonthIdx,A=CURRENT_YEAR;
  const personas=getPersonas();
  const td=getTotalDeudaMes(M,A),tf=getTotalFijosMes(M,A),fp=getTotalFijosPend(M,A),tg=td+tf;
  const fijosAct=fijos.filter(f=>fijoActivoEnMes(f,M,A));
  let html=`<div class="month-nav">
    <button onclick="changeMonth(-1)">←</button>
    <span class="month-label">${MONTHS[M]} ${A}</span>
    <button onclick="changeMonth(1)">→</button>
  </div>
  <div class="summary-grid">
    <div class="metric"><div class="metric-label">Total mes</div><div class="metric-value">${fmt(tg)}</div></div>
    <div class="metric"><div class="metric-label">Cuotas</div><div class="metric-value ${td<0?'neg':'pos'}">${td<0?'-':''}${fmt(td)}</div></div>
    <div class="metric"><div class="metric-label">Fijos</div><div class="metric-value neg">-${fmt(tf)}</div></div>
    <div class="metric"><div class="metric-label">Pendientes</div><div class="metric-value neg">-${fmt(fp)}</div></div>
  </div>`;
  if(personas.length){
    html+=`<div class="section-divider">Cuotas por persona</div>`;
    personas.forEach(p=>{
      const items=deudas.filter(d=>d.persona===p&&getCuotaEnMes(d,M,A)!==null);
      if(!items.length)return;
      const tot=items.reduce((s,d)=>s+getMonto(d),0);
      const sald=isSaldado(p,M,A);
      html+=`<div class="card"><div class="card-header">
        <div style="flex:1">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" ${sald?'checked':''} onchange="toggleSaldado('${p}',${M},${A})">
            <span class="card-title ${sald?'saldado':''}">${p}</span>
            ${sald?'<span class="badge badge-saldado">Saldado</span>':''}
          </label>
        </div>
        <span class="badge ${tot<0?'badge-neg':'badge-pos'}">${tot<0?'-':''}${fmt(tot)}</span>
      </div>
      <table><thead><tr><th>Producto</th><th style="width:40%;text-align:right">Cuota</th><th style="text-align:right">Monto</th></tr></thead><tbody>`;
      items.forEach(d=>{
        const c=getCuotaEnMes(d,M,A);
        const isLast=c===d.cuotaTotal,isSub=d.cuotaTotal===999;
        html+=`<tr class="${sald?'paid':''}"><td>${d.producto}${isLast?'<span class="chip last">última</span>':''}${isSub?'<span class="chip">sub</span>':''}</td>
          <td style="text-align:right">${isSub?'—':c+'/'+d.cuotaTotal}</td>
          <td style="text-align:right;color:${d.negativo?'#f88':'#fff'}">${d.negativo?'-':''}${fmt(d.monto)}</td></tr>`;
      });
      html+=`<tr class="total-row"><td colspan="2" style="text-align:right">Total</td><td style="text-align:right;color:${tot<0?'#f88':'#fff'}">${tot<0?'-':''}${fmt(tot)}</td></tr></tbody></table></div>`;
    });
  }
  if(fijosAct.length){
    html+=`<div class="section-divider">Gastos fijos este mes</div><div class="card">
    <table><thead><tr><th style="width:8%"></th><th>Gasto</th><th style="width:20%;text-align:right">Día</th><th style="width:25%;text-align:right">Monto</th></tr></thead><tbody>`;
    fijosAct.forEach(f=>{
      const paid=isPagado(f.id,M,A),cat=getCatById(f.categoriaId);
      html+=`<tr class="${paid?'paid':''}">
        <td style="text-align:center"><input type="checkbox" ${paid?'checked':''} onchange="togglePago(${f.id},${M},${A})"></td>
        <td><span class="cat-dot" style="background:${cat.color}"></span>${f.nombre}</td>
        <td style="text-align:right;font-size:11px">${f.vencimiento}</td>
        <td style="text-align:right;color:${paid?'#666':'#f88'}">${paid?'<s>':''}${fmt(f.monto)}${paid?'</s>':''}</td>
      </tr>`;
    });
    html+=`<tr class="total-row"><td colspan="2"></td><td style="text-align:right">Pend:</td><td style="text-align:right;color:#f88">-${fmt(fp)}</td></tr></tbody></table></div>`;
  }
  html+=`<div class="grand-total">
    <strong>${MONTHS[M]} ${A}</strong><br>
    Cuotas: ${fmt(td)} | Fijos: ${fmt(tf)} | <strong>Total: ${fmt(tg)}</strong>
  </div>`;
  document.getElementById('view-resumen').innerHTML=html;
}

function renderDetalle(){
  const M=currentMonthIdx,A=CURRENT_YEAR;
  const personas=getPersonas();
  let html='';
  personas.forEach(p=>{
    const items=deudas.filter(d=>d.persona===p);
    if(!items.length)return;
    const totalResta=items.reduce((s,d)=>{if(d.cuotaTotal===999)return s;return s+(d.cuotaTotal-d.cuotaInicio+1)*(d.negativo?-d.monto:d.monto);},0);
    const sald=isSaldado(p,M,A);
    html+=`<div class="card"><div class="card-header">
      <div style="flex:1">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" ${sald?'checked':''} onchange="toggleSaldado('${p}',${M},${A})">
          <span class="card-title ${sald?'saldado':''}">${p}</span>
          ${sald?'<span class="badge badge-saldado">Saldado</span>':''}
        </label>
      </div>
      <span class="badge ${totalResta<0?'badge-neg':'badge-pos'}">Resta: ${totalResta<0?'-':''}${fmt(totalResta)}</span>
    </div>
    <table><thead><tr><th>Producto</th><th style="text-align:right">Cuotas</th><th style="text-align:right">Por cuota</th><th style="text-align:right">Total</th></tr></thead><tbody>`;
    items.forEach(d=>{
      const isSub=d.cuotaTotal===999,r=isSub?'∞':(d.cuotaTotal-d.cuotaInicio+1),tr=isSub?'∞':fmt(r*d.monto);
      html+=`<tr class="${sald?'paid':''}"><td>${d.producto}</td><td style="text-align:right">${isSub?'Sub':d.cuotaInicio+'/'+d.cuotaTotal}</td><td style="text-align:right;color:${d.negativo?'#f88':'#fff'}">${d.negativo?'-':''}${fmt(d.monto)}</td><td style="text-align:right;color:${d.negativo?'#f88':'#fff'}">${d.negativo?'-':''}${tr}</td></tr>`;
    });
    html+=`</tbody></table></div>`;
  });
  document.getElementById('view-detalle').innerHTML=html;
}

function renderLista(){
  let totPos=0,totNeg=0;
  deudas.forEach(d=>{if(d.cuotaTotal===999)return;const r=d.cuotaTotal-d.cuotaInicio+1;if(d.negativo)totNeg+=r*d.monto;else totPos+=r*d.monto;});
  const neto=totPos-totNeg;
  let html=`<div class="card"><table><thead><tr><th>Persona</th><th>Producto</th><th style="text-align:center">C</th><th style="text-align:center">T</th><th style="text-align:right">Monto</th><th style="text-align:center">Año</th><th style="text-align:center">Dir</th><th></th></tr></thead><tbody>`;
  deudas.forEach(d=>{
    const isSub=d.cuotaTotal===999;
    const isEditing=editingId===d.id;
    if(isEditing){
      html+=`<tr style="background:#1a2a1a">
        <td colspan="8">
          <div style="padding:8px">
            <div style="font-size:12px;color:#aaa;margin-bottom:8px">✏️ Editando: <strong style="color:#fff">${d.producto}</strong> — <em>hacé click en otra fila para cancelar</em></div>
            <div class="form-grid">
              <div class="form-group"><label>Persona</label><input id="e-persona" value="${d.persona}"></div>
              <div class="form-group"><label>Producto</label><input id="e-producto" value="${d.producto}"></div>
              <div class="form-group"><label>Monto/cuota</label><input id="e-monto" type="number" value="${d.monto}"></div>
              <div class="form-group"><label>Cuota ini</label><input id="e-cini" type="number" value="${d.cuotaInicio}"></div>
              <div class="form-group"><label>Total cuotas</label><input id="e-ctot" type="number" value="${isSub?'':d.cuotaTotal}" placeholder="${isSub?'Sub (dejar vacío)':''}"></div>
              <div class="form-group"><label>Mes inicio</label><select id="e-mes">${MONTHS.map((m,i)=>`<option value="${i}"${i===d.mesInicio?' selected':''}>${m}</option>`).join('')}</select></div>
              <div class="form-group"><label>Año inicio</label><input id="e-ano" type="number" value="${d.anoInicio||2026}"></div>
              <div class="form-group"><label>Dirección</label><select id="e-neg"><option value="false"${!d.negativo?' selected':''}>Me deben</option><option value="true"${d.negativo?' selected':''}>Yo debo</option></select></div>
            </div>
            <div style="display:flex;gap:8px;margin-top:10px">
              <button onclick="guardarEdit(${d.id})" style="background:#2a5a3a;border-color:#4a7a5a">✓ Guardar</button>
              <button onclick="cancelEdit()">Cancelar</button>
              <button class="danger" onclick="eliminarDeuda(${d.id})">✕ Eliminar</button>
            </div>
          </div>
        </td>
      </tr>`;
    } else {
      html+=`<tr style="cursor:pointer" onclick="startEdit(${d.id})">
        <td>${d.persona}</td><td>${d.producto}</td>
        <td style="text-align:center">${d.cuotaInicio}</td><td style="text-align:center">${isSub?'S':d.cuotaTotal}</td>
        <td style="text-align:right;color:${d.negativo?'#f88':'#fff'}">${d.negativo?'-':''}${fmt(d.monto)}</td>
        <td style="text-align:center">${d.anoInicio||2026}</td>
        <td style="text-align:center"><span class="badge ${d.negativo?'badge-neg':'badge-pos'}">${d.negativo?'D':'A'}</span></td>
        <td onclick="event.stopPropagation()"><button class="danger" onclick="eliminarDeuda(${d.id})">✕</button></td>
      </tr>`;
    }
  });
  html+=`</tbody></table></div>
  <div class="grand-total">
    <strong>Total acumulado (excl. subs)</strong><br>
    Te deben: ${fmt(totPos)} | Debés: ${fmt(totNeg)} | <strong>Neto: ${fmt(neto)}</strong>
  </div>`;
  document.getElementById('view-lista').innerHTML=html;
}

function startEdit(id){editingId=(editingId===id)?null:id;renderLista();}
function cancelEdit(){editingId=null;renderLista();}
function guardarEdit(id){
  const d=deudas.find(x=>x.id===id);if(!d)return;
  const persona=document.getElementById('e-persona').value.trim();
  const producto=document.getElementById('e-producto').value.trim();
  const monto=parseFloat(document.getElementById('e-monto').value);
  const cini=parseInt(document.getElementById('e-cini').value);
  const ctotVal=document.getElementById('e-ctot').value.trim();
  const ctot=ctotVal===''?999:parseInt(ctotVal);
  const mesInicio=parseInt(document.getElementById('e-mes').value);
  const anoInicio=parseInt(document.getElementById('e-ano').value)||2026;
  const negativo=document.getElementById('e-neg').value==='true';
  if(!persona||!producto||isNaN(monto)||isNaN(cini)||isNaN(ctot)){alert('Completá todos los campos');return;}
  Object.assign(d,{persona,producto,monto,cuotaInicio:cini,cuotaTotal:ctot,mesInicio,anoInicio,negativo});
  editingId=null;
  guardar();
  renderLista();
}

function renderFijos(){
  const M=currentMonthIdx,A=CURRENT_YEAR;
  const totalMes=getTotalFijosMes(M,A),pendiente=getTotalFijosPend(M,A),pagado=totalMes-pendiente;
  let html=`<div class="month-nav">
    <button onclick="changeFijoMonth(-1)">←</button>
    <span class="month-label">${MONTHS[M]} ${A}</span>
    <button onclick="changeFijoMonth(1)">→</button>
  </div>
  <div class="summary-grid">
    <div class="metric"><div class="metric-label">Total</div><div class="metric-value neg">${fmt(totalMes)}</div></div>
    <div class="metric"><div class="metric-label">Pagado</div><div class="metric-value pos">${fmt(pagado)}</div></div>
    <div class="metric"><div class="metric-label">Pendiente</div><div class="metric-value neg">${fmt(pendiente)}</div></div>
  </div>`;
  if(fijos.length){
    html+=`<div class="card"><table><thead><tr><th>✓</th><th>Nombre</th><th style="text-align:center">Frecuencia</th><th style="text-align:center">Vence</th><th style="text-align:right">Monto</th></tr></thead><tbody>`;
    fijos.forEach(f=>{
      const paid=isPagado(f.id,M,A),activo=fijoActivoEnMes(f,M,A);
      html+=`<tr class="${paid&&activo?'paid':''}">
        <td>${activo?`<input type="checkbox" ${paid?'checked':''} onchange="togglePago(${f.id},${M},${A})">`:'-'}</td>
        <td>${f.nombre}</td>
        <td style="text-align:center;font-size:11px">${FREQ_LABEL[f.frecuencia]}</td>
        <td style="text-align:center">${f.vencimiento}</td>
        <td style="text-align:right;color:${paid&&activo?'#666':'#f88'}">${paid&&activo?'<s>':''}${fmt(f.monto)}${paid&&activo?'</s>':''}</td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
  }
  html+=`<div class="card" style="margin-top:1rem"><strong>Agregar gasto fijo</strong>
    <div class="form-grid" style="margin-top:10px">
      <div class="form-group"><label>Nombre</label><input id="ff-nombre" placeholder="Luz"></div>
      <div class="form-group"><label>Categoría</label><select id="ff-cat">${catSelectOptions(categorias[0]?.id)}</select></div>
      <div class="form-group"><label>Monto</label><input id="ff-monto" type="number" placeholder="15000"></div>
      <div class="form-group"><label>Frecuencia</label><select id="ff-freq">${Object.entries(FREQ_LABEL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="form-group"><label>Vencimiento</label><input id="ff-venc" type="number" min="1" max="31" value="10"></div>
    </div>
    <button onclick="agregarFijo()" style="margin-top:10px">+ Agregar</button>
  </div>`;
  document.getElementById('view-fijos').innerHTML=html;
}

function renderCategorias(){
  let html=`<div class="card"><strong>Categorías</strong>
    <table style="margin-top:10px"><thead><tr><th>Nombre</th><th style="text-align:right">Gastos</th><th></th></tr></thead><tbody>`;
  categorias.forEach(c=>{
    const count=fijos.filter(f=>f.categoriaId===c.id).length;
    html+=`<tr><td><span class="cat-dot" style="background:${c.color}"></span>${c.nombre}</td><td style="text-align:right">${count}</td>
      <td>${count===0?`<button class="danger" onclick="eliminarCategoria(${c.id})">✕</button>`:''}</td></tr>`;
  });
  html+=`</tbody></table></div>
  <div class="card" style="margin-top:1rem"><strong>Nueva categoría</strong>
    <div class="form-grid" style="margin-top:10px">
      <div class="form-group"><label>Nombre</label><input id="nc-nombre" placeholder="Educación"></div>
      <div class="form-group" style="grid-column:span 2"><label>Color</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">`;
  CAT_COLORS.forEach(col=>{html+=`<span onclick="selectColor('${col}')" style="width:20px;height:20px;background:${col};border-radius:50%;cursor:pointer;border:2px solid transparent" id="c-${col.slice(1)}"></span>`;});
  html+=`</div></div>
      <input id="nc-color" type="hidden" value="${CAT_COLORS[0]}">
    </div>
    <button onclick="agregarCategoria()" style="margin-top:10px">+ Agregar</button>
  </div>`;
  document.getElementById('view-categorias').innerHTML=html;
  selectColor(CAT_COLORS[0]);
}

function renderAgregar(){
  const ps=getPersonas();
  let html=`<div class="card"><strong>Nueva deuda en cuotas</strong>
    <div class="form-grid" style="margin-top:10px">
      <div class="form-group"><label>Persona</label><input id="f-persona" placeholder="Ramón" list="fpl"><datalist id="fpl">${ps.map(p=>`<option value="${p}">`).join('')}</datalist></div>
      <div class="form-group"><label>Producto</label><input id="f-producto" placeholder="PS5"></div>
      <div class="form-group"><label>Monto/cuota</label><input id="f-monto" type="number" placeholder="50000"></div>
      <div class="form-group"><label>Cuota ini</label><input id="f-cini" type="number" value="1"></div>
      <div class="form-group"><label>Total cuotas</label><input id="f-ctot" type="number" placeholder="12"></div>
      <div class="form-group"><label>Mes</label><select id="f-mes">${MONTHS.map((m,i)=>`<option value="${i}"${i===CURRENT_MONTH?' selected':''}>${m}</option>`).join('')}</select></div>
      <div class="form-group"><label>Año</label><input id="f-ano" type="number" value="${CURRENT_YEAR}"></div>
      <div class="form-group"><label>Dirección</label><select id="f-neg"><option value="false">Me deben</option><option value="true">Yo debo</option></select></div>
    </div>
    <button onclick="agregarDeuda()" style="margin-top:10px">+ Agregar</button>
  </div>`;
  document.getElementById('view-agregar').innerHTML=html;
}

function selectColor(col){
  document.querySelectorAll('[id^="c-"]').forEach(el=>el.style.border='2px solid transparent');
  const el=document.getElementById('c-'+col.slice(1));
  if(el)el.style.border='2px solid #fff';
  document.getElementById('nc-color').value=col;
}
function agregarCategoria(){
  const nombre=document.getElementById('nc-nombre').value.trim();
  const color=document.getElementById('nc-color').value||CAT_COLORS[0];
  if(!nombre){alert('Ingresá un nombre');return;}
  if(categorias.find(c=>c.nombre.toLowerCase()===nombre.toLowerCase())){alert('Ya existe');return;}
  categorias.push({id:Date.now(),nombre,color});
  guardar();renderCategorias();
}
function eliminarCategoria(id){if(fijos.some(f=>f.categoriaId===id))return;categorias=categorias.filter(x=>x.id!==id);guardar();renderCategorias();}

function agregarFijo(){
  const nombre=document.getElementById('ff-nombre').value.trim(),monto=parseFloat(document.getElementById('ff-monto').value);
  if(!nombre||isNaN(monto)){alert('Completá campos');return;}
  fijos.push({id:Date.now(),nombre,monto,frecuencia:document.getElementById('ff-freq').value,vencimiento:parseInt(document.getElementById('ff-venc').value),mesBase:5,anoBase:CURRENT_YEAR,categoriaId:parseInt(document.getElementById('ff-cat').value)});
  guardar();renderFijos();
}
function eliminarFijo(id){fijos=fijos.filter(x=>x.id!==id);guardar();renderFijos();}
function eliminarDeuda(id){deudas=deudas.filter(x=>x.id!==id);guardar();renderLista();}
function changeMonth(dir){currentMonthIdx=Math.max(0,Math.min(11,currentMonthIdx+dir));renderResumen();}
function changeFijoMonth(dir){currentMonthIdx=Math.max(0,Math.min(11,currentMonthIdx+dir));renderFijos();}
function agregarDeuda(){
  const persona=document.getElementById('f-persona').value.trim(),producto=document.getElementById('f-producto').value.trim(),monto=parseFloat(document.getElementById('f-monto').value),cini=parseInt(document.getElementById('f-cini').value),ctot=parseInt(document.getElementById('f-ctot').value),mesInicio=parseInt(document.getElementById('f-mes').value),anoInicio=parseInt(document.getElementById('f-ano').value)||CURRENT_YEAR,negativo=document.getElementById('f-neg').value==='true';
  if(!persona||!producto||isNaN(monto)||isNaN(cini)||isNaN(ctot)){alert('Completá campos');return;}
  deudas.push({id:Date.now(),persona,producto,cuotaInicio:cini,cuotaTotal:ctot,monto,mesInicio,anoInicio,negativo});
  guardar();renderAgregar();alert(`"${producto}" agregado para ${persona}`);
}
function setView(v){
  currentView=v;
  document.querySelectorAll('[id^="view-"]').forEach(el=>{el.classList.add('hide');});
  document.getElementById('view-'+v).classList.remove('hide');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  if(v==='resumen')renderResumen();
  else if(v==='detalle')renderDetalle();
  else if(v==='lista')renderLista();
  else if(v==='fijos')renderFijos();
  else if(v==='categorias')renderCategorias();
  else if(v==='agregar')renderAgregar();
}

function init(){
  const sd=load('gd-deudas'),sc=load('gd-cats'),sf=load('gd-fijos'),sp=load('gd-pagados'),ss=load('gd-saldados');
  deudas = migrateDeudas(sd || DEFAULT_DEUDAS);
  categorias = sc || DEFAULT_CATS;
  pagados = sp || {};
  saldados = ss || {};
  if(sf&&sf.length>0){
    fijos = migrateFijos(sf);
    const existIds=fijos.map(f=>f.id);
    DEFAULT_FIJOS.forEach(df=>{if(!existIds.includes(df.id))fijos.push(df);});
  } else {
    fijos = DEFAULT_FIJOS;
  }
  if(!categorias.find(c=>c.id===207)) categorias.push({id:207,nombre:'Tahiel',color:'#D4537E'});
  guardar();
  renderResumen();
}

init();
</script>
</body>
</html>
